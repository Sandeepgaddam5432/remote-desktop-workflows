name: 🖥️ Ubuntu Cloud Workstation (Zero-Error Edition)

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  WORKSPACE_USER: sandsneha
  VNC_DISPLAY: :1
  VNC_PORT: 5901
  BACKUP_REGISTRY_REPO: backup-files
  WORKSPACE_DIR: /home/sandsneha/Desktop/sand

jobs:
  cloud-workstation:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
      #━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 🔧 PHASE 1: System Setup (Permission-Safe)
      #━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      
      - name: 📦 Install Desktop Environment & VNC Server
        run: |
          set -e
          echo "🔧 Installing XFCE4 Desktop & TigerVNC..."
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 xfce4-goodies tigervnc-standalone-server tigervnc-common \
            dbus-x11 inotify-tools git curl wget jq
          echo "✅ Desktop environment installed"

      - name: 👤 Create User & Fix Permissions (CRITICAL)
        env:
          USER_PASSWORD: ${{ secrets.VNC_PASSWORD || 'P@ssw0rd123!' }}
        run: |
          set -e
          echo "👤 Creating user: $WORKSPACE_USER"
          
          # Step 1: Create user with home directory
          sudo useradd -m -s /bin/bash -G sudo $WORKSPACE_USER
          
          # Step 2: IMMEDIATE ownership fix (prevents permission issues)
          sudo chown -R $WORKSPACE_USER:$WORKSPACE_USER /home/$WORKSPACE_USER
          echo "✅ User created with proper ownership"
          
          # Step 3: Set user password
          echo "$WORKSPACE_USER:$USER_PASSWORD" | sudo chpasswd
          
          # Step 4: Configure sudo without password
          echo "$WORKSPACE_USER ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/$WORKSPACE_USER
          sudo chmod 0440 /etc/sudoers.d/$WORKSPACE_USER
          
          echo "✅ User permissions configured"

      - name: 🔐 Configure VNC (Permission-Safe Method)
        env:
          USER_PASSWORD: ${{ secrets.VNC_PASSWORD || 'P@ssw0rd123!' }}
        run: |
          set -e
          echo "🔐 Configuring VNC for user: $WORKSPACE_USER"
          
          # Step 1: Create .vnc directory as USER (not root!)
          sudo -u $WORKSPACE_USER mkdir -p /home/$WORKSPACE_USER/.vnc
          
          # Step 2: Create VNC password file with proper ownership
          # CRITICAL: Use bash -c to handle file redirection as the user
          echo "$USER_PASSWORD" | sudo -u $WORKSPACE_USER bash -c 'vncpasswd -f > /home/$WORKSPACE_USER/.vnc/passwd'
          
          # Step 3: Verify file was created
          if [ ! -f /home/$WORKSPACE_USER/.vnc/passwd ]; then
            echo "❌ VNC password file creation failed"
            exit 1
          fi
          
          # Step 4: Set strict permissions (VNC requires 600)
          sudo -u $WORKSPACE_USER chmod 600 /home/$WORKSPACE_USER/.vnc/passwd
          
          # Step 5: Verify ownership
          ls -la /home/$WORKSPACE_USER/.vnc/passwd
          
          # Step 6: Create xstartup script as USER
          sudo -u $WORKSPACE_USER tee /home/$WORKSPACE_USER/.vnc/xstartup > /dev/null << 'EOFXSTARTUP'
          #!/bin/bash
          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS
          exec startxfce4
          EOFXSTARTUP
          
          # Step 7: Make xstartup executable
          sudo -u $WORKSPACE_USER chmod +x /home/$WORKSPACE_USER/.vnc/xstartup
          
          # Step 8: Create Desktop directory and workspace
          sudo -u $WORKSPACE_USER mkdir -p $WORKSPACE_DIR
          
          # Step 9: Final ownership verification
          sudo chown -R $WORKSPACE_USER:$WORKSPACE_USER /home/$WORKSPACE_USER
          
          echo "✅ VNC configured successfully with correct permissions"

      - name: 🚀 Start VNC Server
        run: |
          set -e
          echo "🚀 Starting TigerVNC Server..."
          
          # Start VNC as the user (not root!)
          sudo -u $WORKSPACE_USER vncserver $VNC_DISPLAY \
            -geometry 1920x1080 \
            -depth 24 \
            -localhost no \
            -SecurityTypes VncAuth
          
          # Wait for VNC to initialize
          sleep 3
          
          # Verify VNC is running
          if sudo -u $WORKSPACE_USER vncserver -list | grep -q "$VNC_DISPLAY"; then
            echo "✅ VNC Server is running on port $VNC_PORT"
            sudo -u $WORKSPACE_USER vncserver -list
          else
            echo "❌ VNC Server failed to start"
            sudo -u $WORKSPACE_USER cat /home/$WORKSPACE_USER/.vnc/*.log || true
            exit 1
          fi

      #━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 🌐 PHASE 2: Cloudflare Tunnel (Robust Detection)
      #━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      
      - name: ☁️ Install & Start Cloudflare Tunnel
        run: |
          set -e
          echo "☁️ Installing cloudflared..."
          
          # Download and install
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          rm cloudflared-linux-amd64.deb
          
          echo "🌐 Starting Cloudflare tunnel..."
          
          # Start tunnel in background with logging
          nohup cloudflared tunnel --url tcp://localhost:$VNC_PORT > /tmp/cloudflare.log 2>&1 &
          TUNNEL_PID=$!
          
          # Wait for tunnel URL with timeout
          echo "⏳ Waiting for tunnel to initialize..."
          TUNNEL_HOST=""
          
          for i in {1..60}; do
            if [ -f /tmp/cloudflare.log ] && grep -q "https://.*trycloudflare.com" /tmp/cloudflare.log; then
              TUNNEL_HOST=$(grep -oP 'https://\K[^/]+\.trycloudflare\.com' /tmp/cloudflare.log | head -1)
              break
            fi
            sleep 1
          done
          
          # Verify tunnel established
          if [ -z "$TUNNEL_HOST" ]; then
            echo "❌ Failed to establish tunnel after 60 seconds"
            echo "📋 Cloudflare logs:"
            cat /tmp/cloudflare.log
            exit 1
          fi
          
          # Success! Print connection details
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ TUNNEL ESTABLISHED SUCCESSFULLY!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "🎯 STEP 1: Run this command on your LOCAL machine:"
          echo ""
          echo "   cloudflared access tcp --hostname $TUNNEL_HOST --url 127.0.0.1:$VNC_PORT"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📌 STEP 2: Then connect your VNC Viewer to:"
          echo ""
          echo "   Address: localhost:$VNC_PORT"
          echo "   Password: <your VNC_PASSWORD secret>"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""

      #━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 🧠 PHASE 3: Smart Backup - Restore Phase
      #━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      
      - name: 🔄 Restore Previous Projects
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -e
          echo "🔄 Starting project restoration..."
          
          # Configure git as USER
          sudo -u $WORKSPACE_USER git config --global user.name "$WORKSPACE_USER"
          sudo -u $WORKSPACE_USER git config --global user.email "$WORKSPACE_USER@github.com"
          
          # Registry URL
          REGISTRY_URL="https://x-access-token:${GH_TOKEN}@github.com/${WORKSPACE_USER}/${BACKUP_REGISTRY_REPO}.git"
          
          # Check if registry exists
          if sudo -u $WORKSPACE_USER git ls-remote "$REGISTRY_URL" &>/dev/null; then
            echo "📥 Found existing backup registry"
            
            # Clone registry as USER
            sudo -u $WORKSPACE_USER git clone --depth=1 "$REGISTRY_URL" /tmp/backup-registry
            
            if [ -f /tmp/backup-registry/README.md ]; then
              echo "📋 Restoring projects from registry..."
              
              # Process each repository
              grep -oP '^\s*-\s*\K[a-zA-Z0-9_-]+/[a-zA-Z0-9_-]+' /tmp/backup-registry/README.md | while read repo; do
                PROJECT_NAME=$(basename "$repo")
                PROJECT_URL="https://x-access-token:${GH_TOKEN}@github.com/${repo}.git"
                
                echo "  📦 Restoring: $PROJECT_NAME"
                
                # Clone as USER to workspace
                if sudo -u $WORKSPACE_USER git clone --depth=1 "$PROJECT_URL" "$WORKSPACE_DIR/$PROJECT_NAME" 2>/dev/null; then
                  echo "    ✅ Restored"
                else
                  echo "    ⚠️  Skipped (may not exist)"
                fi
              done
            fi
            
            # Cleanup
            sudo rm -rf /tmp/backup-registry
            
          else
            echo "📝 Creating new backup registry..."
            
            # Create registry as USER
            sudo -u $WORKSPACE_USER mkdir -p /tmp/new-registry
            
            # Create README using tee
            sudo -u $WORKSPACE_USER tee /tmp/new-registry/README.md > /dev/null << 'EOFREADME'
          # 🗂️ Backup Registry
          
          Auto-managed project list for cloud workstation.
          
          ## Projects:
          
          EOFREADME
            
            # Git operations as USER
            cd /tmp/new-registry
            sudo -u $WORKSPACE_USER git init
            sudo -u $WORKSPACE_USER git add README.md
            sudo -u $WORKSPACE_USER git commit -m "Initialize backup registry"
            sudo -u $WORKSPACE_USER git branch -M main
            
            # Create repo via API
            curl -s -X POST \
              -H "Authorization: token ${GH_TOKEN}" \
              -H "Accept: application/vnd.github.v3+json" \
              https://api.github.com/user/repos \
              -d "{\"name\":\"${BACKUP_REGISTRY_REPO}\",\"private\":true}" > /dev/null 2>&1 || true
            
            sleep 3
            
            # Push as USER
            sudo -u $WORKSPACE_USER git remote add origin "$REGISTRY_URL"
            sudo -u $WORKSPACE_USER git push -u origin main 2>/dev/null || echo "⚠️  Initial push may have timed out, will retry later"
            
            # Cleanup
            cd /
            sudo rm -rf /tmp/new-registry
            
            echo "✅ Registry created"
          fi
          
          echo "✅ Restore phase completed"

      #━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 🛠️ PHASE 4: Development Tools
      #━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      
      - name: 🐍 Install Python
        run: |
          set -e
          echo "🐍 Installing Python..."
          sudo apt-get install -y python3 python3-pip python3-venv
          python3 --version
          echo "✅ Python ready"

      - name: 📗 Install Node.js & NPM
        run: |
          set -e
          echo "📗 Installing Node.js LTS..."
          curl -fsSL https://deb.nodesource.com/setup_lts.x | sudo -E bash -
          sudo apt-get install -y nodejs
          node --version
          npm --version
          echo "✅ Node.js ready"

      - name: 💻 Install VS Code
        run: |
          set -e
          echo "💻 Installing Visual Studio Code..."
          wget -qO- https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor > packages.microsoft.gpg
          sudo install -D -o root -g root -m 644 packages.microsoft.gpg /etc/apt/keyrings/packages.microsoft.gpg
          sudo sh -c 'echo "deb [arch=amd64,arm64,armhf signed-by=/etc/apt/keyrings/packages.microsoft.gpg] https://packages.microsoft.com/repos/code stable main" > /etc/apt/sources.list.d/vscode.list'
          rm packages.microsoft.gpg
          sudo apt-get update -qq
          sudo apt-get install -y code
          echo "✅ VS Code ready"

      - name: 🌌 Install Google Antigravity IDE (Fail-Safe)
        run: |
          set +e
          echo "🌌 Attempting Antigravity IDE installation..."
          
          # Try direct download
          if wget -q --timeout=10 https://dl.google.com/linux/direct/antigravity-ide_latest_amd64.deb 2>/dev/null; then
            sudo dpkg -i antigravity-ide_latest_amd64.deb 2>/dev/null && sudo apt-get install -f -y 2>/dev/null
            if command -v antigravity-ide &> /dev/null; then
              echo "✅ Antigravity IDE installed"
            else
              echo "⚠️  Antigravity IDE installation incomplete, skipping..."
            fi
          else
            if sudo snap install antigravity-ide 2>/dev/null; then
              echo "✅ Antigravity IDE installed via snap"
            else
              echo "⚠️  Antigravity IDE not available, continuing without it..."
            fi
          fi
          
          exit 0

      #━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 🧠 PHASE 5: Real-Time Backup Watcher
      #━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      
      - name: 👁️ Deploy inotify Backup System
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -e
          echo "👁️ Deploying real-time backup watcher..."
          
          # Create backup script as USER using tee
          sudo -u $WORKSPACE_USER tee /home/$WORKSPACE_USER/backup-watcher.sh > /dev/null << 'EOFSCRIPT'
          #!/bin/bash
          set -e
          
          WORKSPACE_DIR="/home/sandsneha/Desktop/sand"
          WORKSPACE_USER="sandsneha"
          BACKUP_REGISTRY_REPO="backup-files"
          LOCKFILE="/tmp/backup.lock"
          
          update_registry() {
              local PROJECT_NAME=$1
              local PROJECT_REPO="${WORKSPACE_USER}/${PROJECT_NAME}"
              local REGISTRY_URL="https://x-access-token:${GH_TOKEN}@github.com/${WORKSPACE_USER}/${BACKUP_REGISTRY_REPO}.git"
              
              exec 200>"$LOCKFILE"
              flock -x 200
              
              cd /tmp
              rm -rf backup-registry-temp
              git clone --depth=1 "$REGISTRY_URL" backup-registry-temp 2>/dev/null || {
                  echo "  ⚠️  Failed to clone registry"
                  flock -u 200
                  return 1
              }
              
              cd backup-registry-temp
              
              if ! grep -q "^- ${PROJECT_REPO}$" README.md 2>/dev/null; then
                  echo "- ${PROJECT_REPO}" >> README.md
                  git add README.md
                  git commit -m "Add project: ${PROJECT_NAME}"
                  git push origin main 2>/dev/null
                  echo "  ✅ Registry updated"
              else
                  echo "  ℹ️  Already in registry"
              fi
              
              cd /tmp
              rm -rf backup-registry-temp
              flock -u 200
          }
          
          process_new_directory() {
              local DIR_PATH=$1
              local PROJECT_NAME=$(basename "$DIR_PATH")
              local PROJECT_URL="https://x-access-token:${GH_TOKEN}@github.com/${WORKSPACE_USER}/${PROJECT_NAME}.git"
              
              echo ""
              echo "🔍 New directory detected: $PROJECT_NAME"
              echo "  ⏳ Waiting for files to settle (15s)..."
              sleep 15
              
              if [ -z "$(ls -A "$DIR_PATH" 2>/dev/null)" ]; then
                  echo "  ⚠️  Empty directory, skipping"
                  return
              fi
              
              echo "  📦 Creating GitHub repository..."
              
              curl -s -X POST \
                -H "Authorization: token ${GH_TOKEN}" \
                -H "Accept: application/vnd.github.v3+json" \
                https://api.github.com/user/repos \
                -d "{\"name\":\"${PROJECT_NAME}\",\"private\":true}" > /dev/null 2>&1
              
              sleep 3
              
              cd "$DIR_PATH"
              
              if [ ! -d .git ]; then
                  git init
                  git add .
                  git commit -m "Initial commit from cloud workstation" 2>/dev/null || {
                      echo "  ⚠️  Nothing to commit"
                      return
                  }
                  git branch -M main
                  git remote add origin "$PROJECT_URL"
              fi
              
              if git push -u origin main 2>/dev/null; then
                  echo "  ✅ Pushed to GitHub"
                  update_registry "$PROJECT_NAME"
              else
                  echo "  ❌ Push failed"
              fi
          }
          
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "👁️  Backup Watcher Active"
          echo "📂 Monitoring: $WORKSPACE_DIR"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          inotifywait -m -e create --format '%w%f' "$WORKSPACE_DIR" 2>/dev/null | while read NEW_PATH; do
              if [ -d "$NEW_PATH" ]; then
                  process_new_directory "$NEW_PATH" &
              fi
          done
          EOFSCRIPT
          
          # Inject GH_TOKEN into script
          sudo sed -i "s|GH_TOKEN=.*|GH_TOKEN=\"${GH_TOKEN}\"|" /home/$WORKSPACE_USER/backup-watcher.sh
          
          # Make executable
          sudo chmod +x /home/$WORKSPACE_USER/backup-watcher.sh
          
          # Verify script exists
          if [ ! -f /home/$WORKSPACE_USER/backup-watcher.sh ]; then
            echo "❌ Backup script creation failed"
            exit 1
          fi
          
          # Start watcher in background as USER
          sudo -u $WORKSPACE_USER nohup /home/$WORKSPACE_USER/backup-watcher.sh > /tmp/backup-watcher.log 2>&1 &
          
          sleep 2
          
          echo "✅ Backup watcher deployed and running"

      #━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 💚 PHASE 6: Keep-Alive & Monitoring
      #━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      
      - name: 💚 Keep Workstation Alive
        run: |
          set -e
          
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ CLOUD WORKSTATION IS READY!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "🎯 Status:"
          echo "   • VNC Server: Running on port $VNC_PORT"
          echo "   • Cloudflare Tunnel: Active (see connection command above)"
          echo "   • Backup Watcher: Monitoring $WORKSPACE_DIR"
          echo "   • Max Runtime: 6 hours (GitHub Actions limit)"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          
          check_health() {
            if ! sudo -u $WORKSPACE_USER vncserver -list | grep -q "$VNC_DISPLAY"; then
              echo "⚠️  VNC server stopped, restarting..."
              sudo -u $WORKSPACE_USER vncserver $VNC_DISPLAY -geometry 1920x1080 -depth 24 -localhost no
            fi
            
            if ! pgrep -f "backup-watcher.sh" > /dev/null; then
              echo "⚠️  Backup watcher stopped, restarting..."
              sudo -u $WORKSPACE_USER nohup /home/$WORKSPACE_USER/backup-watcher.sh > /tmp/backup-watcher.log 2>&1 &
            fi
          }
          
          COUNTER=0
          while true; do
            sleep 30
            COUNTER=$((COUNTER + 1))
            
            if [ $((COUNTER % 60)) -eq 0 ]; then
              HOURS=$((COUNTER / 120))
              echo "🏥 Health check (Runtime: ${HOURS}h)"
              check_health
            fi
            
            if [ $COUNTER -eq 660 ]; then
              echo ""
              echo "⚠️⚠️⚠️  WARNING  ⚠️⚠️⚠️"

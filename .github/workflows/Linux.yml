name: 🖥️ Ubuntu Cloud Workstation - STABLE VERSION

on:
  workflow_dispatch:

jobs:
  workstation:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
      - name: 📦 Install MATE Desktop & VNC
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            mate-desktop-environment-core \
            mate-terminal \
            tigervnc-standalone-server \
            tigervnc-common \
            dbus-x11 \
            inotify-tools \
            git curl wget jq \
            firefox
          echo "✅ Desktop installed"

      - name: 👤 Setup User
        run: |
          PASS="${{ secrets.VNC_PASSWORD }}"
          if [ -z "$PASS" ]; then
            PASS="P@ssw0rd123!"
          fi
          
          sudo useradd -m -s /bin/bash -G sudo sandsneha
          echo "sandsneha:${PASS}" | sudo chpasswd
          echo "sandsneha ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/sandsneha
          sudo chmod 0440 /etc/sudoers.d/sandsneha
          
          sudo mkdir -p /home/sandsneha/.vnc
          echo "${PASS}" | sudo -u sandsneha vncpasswd -f > /home/sandsneha/.vnc/passwd
          sudo chmod 600 /home/sandsneha/.vnc/passwd
          sudo chown -R sandsneha:sandsneha /home/sandsneha

      - name: 🔐 Create VNC Startup Script
        run: |
          sudo tee /home/sandsneha/.vnc/xstartup > /dev/null << 'ENDSCRIPT'
          #!/bin/sh
          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS
          export XKL_XMODMAP_DISABLE=1
          export XDG_CURRENT_DESKTOP="MATE"
          export XDG_SESSION_TYPE=x11
          [ -x /etc/vnc/xstartup ] && exec /etc/vnc/xstartup
          [ -r $HOME/.Xresources ] && xrdb $HOME/.Xresources
          xsetroot -solid grey
          vncconfig -iconic &
          exec mate-session
          ENDSCRIPT
          
          sudo chmod +x /home/sandsneha/.vnc/xstartup
          sudo chown sandsneha:sandsneha /home/sandsneha/.vnc/xstartup
          sudo mkdir -p /home/sandsneha/Desktop/sand
          sudo chown -R sandsneha:sandsneha /home/sandsneha/Desktop

      - name: 🚀 Start VNC Server
        run: |
          sudo mkdir -p /run/user/1001
          sudo chown sandsneha:sandsneha /run/user/1001
          sudo chmod 700 /run/user/1001
          
          sudo -u sandsneha bash -c 'export XDG_RUNTIME_DIR=/run/user/1001 && vncserver :1 -geometry 1920x1080 -depth 24 -localhost no'
          
          sleep 5
          
          if pgrep -f "Xtigervnc.*:1" > /dev/null; then
            echo "✅ VNC Server is running on :1"
          else
            echo "❌ VNC Server failed to start"
            cat /home/sandsneha/.vnc/*.log
            exit 1
          fi

      - name: ☁️ Setup Cloudflare Tunnel
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          
          cloudflared tunnel --url tcp://localhost:5901 > /tmp/cloudflare.log 2>&1 &
          
          sleep 10
          
          for i in {1..40}; do
            if grep -q "https://" /tmp/cloudflare.log; then
              HOSTNAME=$(grep -oP "https://\K[^[:space:]]+" /tmp/cloudflare.log | grep trycloudflare.com | head -1)
              if [ -n "$HOSTNAME" ]; then
                echo "$HOSTNAME" > /tmp/cf_host.txt
                echo "✅ Tunnel created: $HOSTNAME"
                break
              fi
            fi
            sleep 2
          done

      - name: 🐍 Install Python
        run: |
          sudo apt-get install -y python3 python3-pip python3-venv
          python3 --version

      - name: 📗 Install Node.js
        run: |
          curl -fsSL https://deb.nodesource.com/setup_lts.x | sudo -E bash -
          sudo apt-get install -y nodejs
          node --version

      - name: 💻 Install VS Code
        run: |
          wget -qO- https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor > /tmp/packages.microsoft.gpg
          sudo install -D -o root -g root -m 644 /tmp/packages.microsoft.gpg /etc/apt/keyrings/packages.microsoft.gpg
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/packages.microsoft.gpg] https://packages.microsoft.com/repos/code stable main" | sudo tee /etc/apt/sources.list.d/vscode.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y code

      - name: 🌌 Install Antigravity IDE
        run: |
          curl -fsSL https://us-central1-apt.pkg.dev/doc/repo-signing-key.gpg | sudo gpg --dearmor -o /etc/apt/keyrings/antigravity.gpg
          echo "deb [signed-by=/etc/apt/keyrings/antigravity.gpg] https://us-central1-apt.pkg.dev/projects/antigravity-auto-updater-dev/ antigravity-debian main" | sudo tee /etc/apt/sources.list.d/antigravity.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y antigravity
          antigravity --version

      - name: 🔄 Restore Projects
        run: |
          TOKEN="${{ secrets.GH_TOKEN }}"
          if [ -z "$TOKEN" ]; then
            TOKEN="${{ secrets.GITHUB_TOKEN }}"
          fi
          
          cd /home/sandsneha
          sudo -u sandsneha git config --global user.name "sandsneha"
          sudo -u sandsneha git config --global user.email "sandsneha@github.com"
          
          BACKUP_REPO="https://x-access-token:${TOKEN}@github.com/sandsneha/backup-files.git"
          
          if sudo -u sandsneha git ls-remote "$BACKUP_REPO" &>/dev/null; then
            sudo -u sandsneha git clone --depth=1 "$BACKUP_REPO" /tmp/backup-restore
            
            if [ -f /tmp/backup-restore/README.md ]; then
              grep -oP '^\s*-\s*\K\S+' /tmp/backup-restore/README.md | while read repo; do
                REPO_NAME=$(basename "$repo")
                sudo -u sandsneha git clone --depth=1 "https://x-access-token:${TOKEN}@github.com/${repo}.git" "/home/sandsneha/Desktop/sand/${REPO_NAME}" 2>/dev/null || true
              done
            fi
            
            rm -rf /tmp/backup-restore
          else
            sudo -u sandsneha mkdir -p /tmp/new-backup
            echo '# Backup Repository' | sudo -u sandsneha tee /tmp/new-backup/README.md > /dev/null
            
            cd /tmp/new-backup
            sudo -u sandsneha git init
            sudo -u sandsneha git add .
            sudo -u sandsneha git commit -m "Initial commit"
            sudo -u sandsneha git branch -M main
            
            curl -s -X POST \
              -H "Authorization: token ${TOKEN}" \
              -H "Content-Type: application/json" \
              https://api.github.com/user/repos \
              -d '{"name":"backup-files","private":true}' > /dev/null
            
            sleep 3
            sudo -u sandsneha git remote add origin "$BACKUP_REPO"
            sudo -u sandsneha git push -u origin main 2>/dev/null || true
            
            rm -rf /tmp/new-backup
          fi

      - name: 👁️ Start Backup Watcher
        run: |
          TOKEN="${{ secrets.GH_TOKEN }}"
          if [ -z "$TOKEN" ]; then
            TOKEN="${{ secrets.GITHUB_TOKEN }}"
          fi
          
          sudo tee /home/sandsneha/backup-watcher.sh > /dev/null << 'WATCHERSCRIPT'
          #!/bin/bash
          WATCH_DIR="/home/sandsneha/Desktop/sand"
          USERNAME="sandsneha"
          
          process_new_folder() {
            FOLDER_PATH="$1"
            FOLDER_NAME=$(basename "$FOLDER_PATH")
            
            sleep 15
            
            if [ -z "$(ls -A "$FOLDER_PATH")" ]; then
              return
            fi
            
            curl -s -X POST \
              -H "Authorization: token GITHUB_TOKEN_PLACEHOLDER" \
              -H "Content-Type: application/json" \
              https://api.github.com/user/repos \
              -d "{\"name\":\"$FOLDER_NAME\",\"private\":true}" > /dev/null
            
            cd "$FOLDER_PATH"
            git init
            git add .
            git commit -m "Initial commit"
            git branch -M main
            git remote add origin "https://x-access-token:GITHUB_TOKEN_PLACEHOLDER@github.com/$USERNAME/$FOLDER_NAME.git"
            git push -u origin main 2>/dev/null
            
            if [ $? -eq 0 ]; then
              flock /tmp/backup.lock -c "
                cd /tmp
                rm -rf backup-temp
                git clone --depth=1 https://x-access-token:GITHUB_TOKEN_PLACEHOLDER@github.com/$USERNAME/backup-files.git backup-temp
                cd backup-temp
                echo \"- $USERNAME/$FOLDER_NAME\" >> README.md
                git add .
                git commit -m \"Add $FOLDER_NAME\"
                git push
                cd /tmp
                rm -rf backup-temp
              " 2>/dev/null
            fi
          }
          
          inotifywait -m -e create --format '%w%f' "$WATCH_DIR" | while read NEW_PATH; do
            if [ -d "$NEW_PATH" ]; then
              process_new_folder "$NEW_PATH" &
            fi
          done
          WATCHERSCRIPT
          
          sudo sed -i "s|GITHUB_TOKEN_PLACEHOLDER|${TOKEN}|g" /home/sandsneha/backup-watcher.sh
          sudo chmod +x /home/sandsneha/backup-watcher.sh
          sudo chown sandsneha:sandsneha /home/sandsneha/backup-watcher.sh
          
          sudo -u sandsneha nohup /home/sandsneha/backup-watcher.sh > /dev/null 2>&1 &

      - name: 💚 Keep Alive & Display Info
        run: |
          CLOUDFLARE_HOST=$(cat /tmp/cf_host.txt 2>/dev/null || echo "")
          
          echo ""
          echo "╔═══════════════════════════════════════════════════════╗"
          echo "║                                                       ║"
          echo "║          ✅  WORKSTATION READY & RUNNING  ✅          ║"
          echo "║                                                       ║"
          echo "╚═══════════════════════════════════════════════════════╝"
          echo ""
          
          if [ -n "$CLOUDFLARE_HOST" ]; then
            echo "🎯 STEP 1: Run this command on your LOCAL machine:"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "cloudflared access tcp --hostname $CLOUDFLARE_HOST --url 127.0.0.1:5901"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo ""
            echo "🖥️  STEP 2: Open VNC Viewer and connect to:"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "Server: localhost:5901"
            echo "Password: Your VNC_PASSWORD or P@ssw0rd123!"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          else
            echo "⚠️  Cloudflare tunnel hostname not detected"
            echo "Check the Cloudflare Tunnel step logs for details"
          fi
          
          echo ""
          echo "🔄 Keeping workstation alive..."
          echo ""
          
          while true; do
            sleep 3600
            
            if ! pgrep -f "Xtigervnc.*:1" > /dev/null; then
              echo "🔄 Restarting VNC server..."
              sudo -u sandsneha bash -c 'export XDG_RUNTIME_DIR=/run/user/1001 && vncserver :1 -geometry 1920x1080 -depth 24 -localhost no'
            fi
          done

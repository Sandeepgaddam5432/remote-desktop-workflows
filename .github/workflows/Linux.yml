name: ULTIMATE UBUNTU WORKSTATION (VNC)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # ========================================
      # STEP 1: Cloudflared Installation (Parallel)
      # ========================================
      - name: 🛠️ Setup Cloudflared
        run: |
          echo "📥 Installing Cloudflared..."
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb &
          CLOUDFLARED_PID=$!
          echo "CLOUDFLARED_PID=$CLOUDFLARED_PID" >> $GITHUB_ENV

      # ========================================
      # STEP 2: Fast VNC Desktop Setup
      # ========================================
      - name: 💻 Install VNC Desktop (Lightweight XFCE)
        run: |
          echo "📦 Installing VNC & XFCE (optimized)..."
          
          # Wait for cloudflared if still installing
          wait ${CLOUDFLARED_PID:-} 2>/dev/null || true
          
          # Fast parallel installation
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            xfce4 xfce4-terminal \
            tigervnc-standalone-server tigervnc-common \
            dbus-x11 \
            git wget curl \
            python3 python3-pip \
            nodejs npm &
          INSTALL_PID=$!
          
          echo "⏳ Installing packages in background..."
          wait $INSTALL_PID
          
          echo "✅ VNC Desktop installed!"

      # ========================================
      # STEP 3: Quick User Setup & VNC Config
      # ========================================
      - name: 👤 Create User & Configure VNC
        run: |
          echo "👤 Setting up user 'sandsneha'..."
          
          # Create user
          sudo useradd -m -s /bin/bash sandsneha
          echo "sandsneha:P@ssw0rd123!" | sudo chpasswd
          sudo usermod -aG sudo sandsneha
          
          # Create directories
          sudo mkdir -p /home/sandsneha/Desktop/sand
          sudo mkdir -p /home/sandsneha/.vnc
          
          # Set VNC password (fast method)
          echo "P@ssw0rd123!" | sudo -u sandsneha vncpasswd -f > /home/sandsneha/.vnc/passwd
          sudo chmod 600 /home/sandsneha/.vnc/passwd
          
          # Create VNC startup script (NO FAILSAFE ERRORS!)
          sudo tee /home/sandsneha/.vnc/xstartup > /dev/null << 'EOF'
#!/bin/bash
unset SESSION_MANAGER
unset DBUS_SESSION_BUS_ADDRESS
export XDG_SESSION_TYPE=x11
export XDG_CURRENT_DESKTOP=XFCE
startxfce4 &
EOF
          
          sudo chmod +x /home/sandsneha/.vnc/xstartup
          sudo chown -R sandsneha:sandsneha /home/sandsneha
          
          echo "✅ VNC configured without failsafe issues!"

      # ========================================
      # STEP 4: Fast Development Tools
      # ========================================
      - name: 📦 Install Dev Tools (VS Code)
        run: |
          echo "🔧 Installing VS Code..."
          
          # Install VS Code (fastest method)
          sudo snap install code --classic &
          VSCODE_PID=$!
          
          # Git config (while VS Code installs)
          git config --global init.defaultBranch main
          git config --global advice.defaultBranchName false
          
          wait $VSCODE_PID || echo "VS Code installing..."
          
          echo "✅ Dev tools ready!"

      # ========================================
      # STEP 5: Google Antigravity (Quick Install)
      # ========================================
      - name: 🌌 Install Google Antigravity IDE
        continue-on-error: true
        run: |
          echo "🚀 Installing Antigravity (fast mode)..."
          
          # Try APT first (with timeout)
          timeout 30s bash << 'APTSCRIPT' || echo "APT timeout, trying DEB..."
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://us-central1-apt.pkg.dev/doc/repo-signing-key.gpg | sudo gpg --dearmor --yes -o /etc/apt/keyrings/antigravity-repo-key.gpg
          echo "deb [signed-by=/etc/apt/keyrings/antigravity-repo-key.gpg] https://us-central1-apt.pkg.dev/projects/antigravity-auto-updater-dev antigravity-debian main" | sudo tee /etc/apt/sources.list.d/antigravity.list
          sudo apt-get update -qq
          sudo apt-get install -y antigravity
          APTSCRIPT
          
          # Fallback: Direct DEB
          if ! command -v antigravity &> /dev/null; then
              wget -q -O antigravity.deb "https://us-central1-apt.pkg.dev/projects/antigravity-auto-updater-dev/pool/main/a/antigravity/antigravity_latest_amd64.deb" &
              wait $!
              if [ -f "antigravity.deb" ] && [ -s "antigravity.deb" ]; then
                  sudo dpkg -i antigravity.deb 2>/dev/null || true
                  sudo apt-get install -f -y -qq
              fi
          fi
          
          # Create shortcut if installed
          if command -v antigravity &> /dev/null; then
              sudo tee /home/sandsneha/Desktop/Antigravity.desktop > /dev/null << 'EOF'
[Desktop Entry]
Version=1.0
Type=Application
Name=Antigravity IDE
Exec=antigravity
Icon=applications-development
Terminal=false
Categories=Development;
EOF
              sudo chmod +x /home/sandsneha/Desktop/Antigravity.desktop
              sudo chown sandsneha:sandsneha /home/sandsneha/Desktop/Antigravity.desktop
              echo "✅ Antigravity installed!"
          else
              echo "⚠️ Antigravity skipped"
          fi

      # ========================================
      # STEP 6: Backup System (Optimized)
      # ========================================
      - name: 🤖 Setup Backup System
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "🔧 Configuring backup system..."
          
          git config --global user.name "AutoBackupBot"
          git config --global user.email "bot@backup.com"
          
          BASE_DIR="/home/sandsneha/Desktop"
          SAND_DIR="$BASE_DIR/sand"
          MASTER_REPO="backup-files"
          MASTER_PATH="$BASE_DIR/$MASTER_REPO"
          
          # Quick repo check
          if gh repo view "$MASTER_REPO" &> /dev/null; then
              gh repo clone "$MASTER_REPO" "$MASTER_PATH" -- --depth=1 &
          else
              mkdir -p "$MASTER_PATH"
              cd "$MASTER_PATH"
              echo "# Backup Registry" > README.md
              git init -q
              git add README.md
              git commit -q -m "Init"
              gh repo create "$MASTER_REPO" --private --source=. --push &
          fi
          
          # Restore projects (background)
          if [ -f "$MASTER_PATH/README.md" ]; then
              cd "$SAND_DIR"
              grep -E "^[a-zA-Z0-9_-]+/[a-zA-Z0-9_-]+$" "$MASTER_PATH/README.md" 2>/dev/null | while read -r repo; do
                  gh repo clone "$repo" -- --depth=1 &
              done
          fi
          
          # Efficient monitor script
          sudo tee /home/sandsneha/monitor_backups.sh > /dev/null << 'EOFSCRIPT'
#!/bin/bash
SAND_DIR="/home/sandsneha/Desktop/sand"
MASTER_PATH="/home/sandsneha/Desktop/backup-files"
SLEEP_TIME=60  # Check every 60 seconds

git config --global user.name "AutoBackupBot"
git config --global user.email "bot@backup.com"
git config --global init.defaultBranch main

while true; do
    [ ! -d "$SAND_DIR" ] && sleep $SLEEP_TIME && continue
    
    for folder in "$SAND_DIR"/*; do
        [ ! -d "$folder" ] && continue
        NAME=$(basename "$folder")
        [[ "$NAME" == .* || "$NAME" == "backup-files" ]] && continue
        
        if ! grep -qF "$NAME" "$MASTER_PATH/README.md" 2>/dev/null; then
            cd "$folder"
            if [ ! -d ".git" ]; then
                git init -q
                git add . 2>/dev/null
                git commit -q -m "Auto backup" || continue
                
                if gh repo create "$NAME" --private --source=. --push 2>/dev/null; then
                    OWNER=$(gh api user --jq '.login' 2>/dev/null || echo "user")
                    echo "$OWNER/$NAME" >> "$MASTER_PATH/README.md"
                    cd "$MASTER_PATH"
                    git add README.md
                    git commit -q -m "Added $NAME" 2>/dev/null
                    git push -q 2>/dev/null || true
                fi
            fi
        fi
    done
    sleep $SLEEP_TIME
done
EOFSCRIPT
          
          sudo chmod +x /home/sandsneha/monitor_backups.sh
          sudo chown sandsneha:sandsneha /home/sandsneha/monitor_backups.sh
          
          # Wait for background tasks
          wait
          
          echo "✅ Backup system ready!"

      # ========================================
      # STEP 7: Start VNC & Tunnel (FAST!)
      # ========================================
      - name: 🚀 Start VNC Server & Cloudflare Tunnel
        run: |
          echo "🖥️ Starting VNC server..."
          
          # Set ownership
          sudo chown -R sandsneha:sandsneha /home/sandsneha
          
          # Start backup monitor (background)
          sudo -u sandsneha nohup bash /home/sandsneha/monitor_backups.sh > /dev/null 2>&1 &
          
          # Start VNC server on display :1 (port 5901)
          sudo -u sandsneha vncserver :1 -geometry 1920x1080 -depth 24 > /dev/null 2>&1
          
          # Wait for VNC to be ready
          sleep 3
          
          echo "🌐 Starting Cloudflare Tunnel..."
          # Start tunnel for VNC port 5901
          cloudflared tunnel --url tcp://localhost:5901 --no-autoupdate --logfile tunnel.log > /dev/null 2>&1 &
          
          echo ""
          echo "⏳ Waiting for tunnel URL..."
          
          # Quick URL detection (30 second timeout)
          MAX_WAIT=30
          COUNT=0
          TUNNEL_URL=""
          HOSTNAME=""
          
          while [ $COUNT -lt $MAX_WAIT ]; do
              if [ -f "tunnel.log" ]; then
                  TUNNEL_URL=$(grep -oE "https://[a-zA-Z0-9-]+\.trycloudflare\.com" tunnel.log | head -n 1)
                  
                  if [ -n "$TUNNEL_URL" ]; then
                      HOSTNAME=$(echo "$TUNNEL_URL" | sed 's|https://||')
                      
                      echo ""
                      echo "╔════════════════════════════════════════════════════════════════╗"
                      echo "║                                                                ║"
                      echo "║          ✅ VNC WORKSTATION READY - ULTRA FAST SETUP           ║"
                      echo "║                                                                ║"
                      echo "╟────────────────────────────────────────────────────────────────╢"
                      echo "║  🌐 TUNNEL URL:                                                ║"
                      echo "║     $TUNNEL_URL                            ║"
                      echo "║                                                                ║"
                      echo "║  🔑 VNC PASSWORD: P@ssw0rd123!                                 ║"
                      echo "║  👤 USERNAME: sandsneha                                        ║"
                      echo "║                                                                ║"
                      echo "╟────────────────────────────────────────────────────────────────╢"
                      echo "║  🖥️  LOCAL VNC CONNECTION COMMAND:                             ║"
                      echo "║                                                                ║"
                      echo "║  cloudflared access tcp --hostname $HOSTNAME --url 127.0.0.1:5901  ║"
                      echo "║                                                                ║"
                      echo "╟────────────────────────────────────────────────────────────────╢"
                      echo "║  📝 HOW TO CONNECT:                                            ║"
                      echo "║                                                                ║"
                      echo "║  STEP 1: Copy and run the command above in local terminal     ║"
                      echo "║  STEP 2: Open your VNC viewer (RealVNC, TigerVNC, etc)        ║"
                      echo "║  STEP 3: Connect to: 127.0.0.1:5901                            ║"
                      echo "║  STEP 4: Enter password: P@ssw0rd123!                          ║"
                      echo "║                                                                ║"
                      echo "║  🎨 DISPLAY: 1920x1080 @ 24-bit color                          ║"
                      echo "║  🖼️  DESKTOP: XFCE4 (No failsafe errors!)                      ║"
                      echo "║                                                                ║"
                      echo "╚════════════════════════════════════════════════════════════════╝"
                      echo ""
                      
                      # Show installed software
                      echo "📦 Installed Software:"
                      echo "   ✓ Python $(python3 --version 2>&1 | cut -d' ' -f2)"
                      echo "   ✓ Node.js $(node --version 2>&1)"
                      echo "   ✓ VS Code"
                      command -v antigravity &> /dev/null && echo "   ✓ Google Antigravity IDE" || echo "   ⚠ Antigravity (installation skipped)"
                      echo ""
                      
                      break
                  fi
              fi
              
              sleep 1
              COUNT=$((COUNT+1))
          done
          
          # Error handling
          if [ -z "$TUNNEL_URL" ]; then
              echo ""
              echo "❌ ERROR: Tunnel URL not detected within ${MAX_WAIT}s"
              echo ""
              echo "📋 Tunnel Log:"
              echo "═══════════════════════════════════════════"
              cat tunnel.log 2>/dev/null || echo "No log file found"
              echo "═══════════════════════════════════════════"
              echo ""
              echo "🔍 VNC Server Status:"
              ps aux | grep vnc | grep -v grep || echo "VNC not running"
              echo ""
              echo "📡 Cloudflared Status:"
              ps aux | grep cloudflared | grep -v grep || echo "Cloudflared not running"
          fi
          
          # Keep alive
          echo "🔄 Session active. Workflow will run until timeout..."
          while true; do
              sleep 30
              # Health check
              if ! pgrep -f "Xvnc.*:1" > /dev/null; then
                  echo "⚠️ VNC died, restarting..."
                  sudo -u sandsneha vncserver :1 -geometry 1920x1080 -depth 24 > /dev/null 2>&1
              fi
              if ! pgrep cloudflared > /dev/null; then
                  echo "⚠️ Cloudflared died, restarting..."
                  cloudflared tunnel --url tcp://localhost:5901 --no-autoupdate --logfile tunnel.log > /dev/null 2>&1 &
              fi
          done

name: 🖥️ Ubuntu Cloud Workstation (VNC + Smart Backup)

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  WORKSPACE_USER: sandsneha
  VNC_DISPLAY: :1
  VNC_PORT: 5901
  BACKUP_REGISTRY_REPO: backup-files
  WORKSPACE_DIR: /home/sandsneha/Desktop/sand

jobs:
  cloud-workstation:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours max (GitHub free tier limit)
    
    steps:
      #━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 🔧 PHASE 1: System Setup
      #━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      
      - name: 📦 Install Desktop Environment & VNC Server
        run: |
          set -e
          echo "🔧 Installing XFCE4 Desktop & TigerVNC..."
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 xfce4-goodies tigervnc-standalone-server tigervnc-common \
            dbus-x11 inotify-tools git curl wget jq flock
          echo "✅ Desktop environment installed"

      - name: 👤 Create User & Configure VNC
        env:
          USER_PASSWORD: ${{ secrets.VNC_PASSWORD || 'P@ssw0rd123!' }}
        run: |
          set -e
          echo "👤 Creating user: $WORKSPACE_USER"
          
          # Create user with home directory
          sudo useradd -m -s /bin/bash -G sudo $WORKSPACE_USER
          echo "$WORKSPACE_USER:$USER_PASSWORD" | sudo chpasswd
          
          # Configure sudo without password
          echo "$WORKSPACE_USER ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/$WORKSPACE_USER
          
          # Setup VNC password
          sudo -u $WORKSPACE_USER mkdir -p /home/$WORKSPACE_USER/.vnc
          echo "$USER_PASSWORD" | sudo -u $WORKSPACE_USER vncpasswd -f > /tmp/vncpasswd
          sudo mv /tmp/vncpasswd /home/$WORKSPACE_USER/.vnc/passwd
          sudo chown $WORKSPACE_USER:$WORKSPACE_USER /home/$WORKSPACE_USER/.vnc/passwd
          sudo chmod 600 /home/$WORKSPACE_USER/.vnc/passwd
          
          # Create xstartup for XFCE
          cat <<'EOF' | sudo -u $WORKSPACE_USER tee /home/$WORKSPACE_USER/.vnc/xstartup
#!/bin/bash
unset SESSION_MANAGER
unset DBUS_SESSION_BUS_ADDRESS
exec startxfce4
EOF
          sudo chmod +x /home/$WORKSPACE_USER/.vnc/xstartup
          
          # Create Desktop directory and workspace
          sudo -u $WORKSPACE_USER mkdir -p $WORKSPACE_DIR
          
          echo "✅ User configured with VNC access"

      - name: 🚀 Start VNC Server
        run: |
          set -e
          echo "🚀 Starting TigerVNC Server on display $VNC_DISPLAY (port $VNC_PORT)..."
          
          sudo -u $WORKSPACE_USER vncserver $VNC_DISPLAY \
            -geometry 1920x1080 \
            -depth 24 \
            -localhost no \
            -SecurityTypes VncAuth
          
          sleep 3
          
          # Verify VNC is running
          if sudo -u $WORKSPACE_USER vncserver -list | grep -q "$VNC_DISPLAY"; then
            echo "✅ VNC Server is running"
            sudo -u $WORKSPACE_USER vncserver -list
          else
            echo "❌ VNC Server failed to start"
            exit 1
          fi

      #━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 🌐 PHASE 2: Cloudflare Tunnel Setup
      #━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      
      - name: ☁️ Install & Start Cloudflare Tunnel
        run: |
          set -e
          echo "☁️ Installing cloudflared..."
          
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          
          echo "🌐 Starting tunnel for VNC (port $VNC_PORT)..."
          nohup cloudflared tunnel --url tcp://localhost:$VNC_PORT > /tmp/cloudflare.log 2>&1 &
          
          # Wait for tunnel to initialize and extract hostname
          echo "⏳ Waiting for tunnel hostname..."
          for i in {1..60}; do
            if grep -q "https://.*trycloudflare.com" /tmp/cloudflare.log; then
              TUNNEL_HOST=$(grep -oP 'https://\K[^/]+\.trycloudflare\.com' /tmp/cloudflare.log | head -1)
              echo "✅ Tunnel established!"
              echo ""
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo "🎯 CONNECTION COMMAND (Run on your LOCAL machine):"
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo ""
              echo "cloudflared access tcp --hostname $TUNNEL_HOST --url 127.0.0.1:$VNC_PORT"
              echo ""
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo "📌 Then connect VNC Viewer to: localhost:$VNC_PORT"
              echo "🔑 Password: (your VNC_PASSWORD secret)"
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo ""
              break
            fi
            sleep 1
          done
          
          if [ -z "$TUNNEL_HOST" ]; then
            echo "❌ Failed to extract tunnel hostname"
            cat /tmp/cloudflare.log
            exit 1
          fi

      #━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 🧠 PHASE 3: Smart Backup System - Restore
      #━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      
      - name: 🔄 Restore Previous Projects
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -e
          echo "🔄 Restoring projects from backup registry..."
          
          cd /home/$WORKSPACE_USER
          
          # Configure git for user
          sudo -u $WORKSPACE_USER git config --global user.name "$WORKSPACE_USER"
          sudo -u $WORKSPACE_USER git config --global user.email "$WORKSPACE_USER@github.com"
          
          # Check if backup registry exists
          REGISTRY_URL="https://x-access-token:${GH_TOKEN}@github.com/${WORKSPACE_USER}/${BACKUP_REGISTRY_REPO}.git"
          
          if sudo -u $WORKSPACE_USER git ls-remote "$REGISTRY_URL" &>/dev/null; then
            echo "📥 Found existing backup registry, cloning..."
            sudo -u $WORKSPACE_USER git clone --depth=1 "$REGISTRY_URL" /tmp/backup-registry
            
            if [ -f /tmp/backup-registry/README.md ]; then
              echo "📋 Reading project list..."
              
              # Extract repository names (format: username/repo-name)
              grep -oP '^\s*-\s*\K[a-zA-Z0-9_-]+/[a-zA-Z0-9_-]+' /tmp/backup-registry/README.md | while read repo; do
                PROJECT_NAME=$(basename "$repo")
                PROJECT_URL="https://x-access-token:${GH_TOKEN}@github.com/${repo}.git"
                
                echo "  📦 Restoring: $PROJECT_NAME"
                
                if sudo -u $WORKSPACE_USER git clone --depth=1 "$PROJECT_URL" "$WORKSPACE_DIR/$PROJECT_NAME" 2>/dev/null; then
                  echo "    ✅ Restored successfully"
                else
                  echo "    ⚠️  Failed to restore (repo may not exist)"
                fi
              done
            fi
            
            rm -rf /tmp/backup-registry
          else
            echo "📝 No existing backup registry found. Creating new one..."
            
            # Create new backup registry
            sudo -u $WORKSPACE_USER mkdir -p /tmp/new-registry
            cat <<'EOFREADME' | sudo -u $WORKSPACE_USER tee /tmp/new-registry/README.md
# 🗂️ Backup Registry

This file tracks all projects in the `sand` workspace.

## Projects:
<!-- Auto-managed by workflow - Do not edit manually -->

EOFREADME
            
            cd /tmp/new-registry
            sudo -u $WORKSPACE_USER git init
            sudo -u $WORKSPACE_USER git add README.md
            sudo -u $WORKSPACE_USER git commit -m "Initialize backup registry"
            sudo -u $WORKSPACE_USER git branch -M main
            
            # Create private repo via GitHub API
            curl -s -X POST \
              -H "Authorization: token ${GH_TOKEN}" \
              -H "Accept: application/vnd.github.v3+json" \
              https://api.github.com/user/repos \
              -d "{\"name\":\"${BACKUP_REGISTRY_REPO}\",\"private\":true}" || true
            
            sleep 2
            sudo -u $WORKSPACE_USER git remote add origin "$REGISTRY_URL"
            sudo -u $WORKSPACE_USER git push -u origin main
            
            rm -rf /tmp/new-registry
            echo "✅ Backup registry created"
          fi
          
          echo "✅ Restore phase completed"

      #━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 🛠️ PHASE 4: Development Tools Installation
      #━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      
      - name: 🐍 Install Python (Latest)
        run: |
          set -e
          echo "🐍 Installing Python..."
          sudo apt-get install -y python3 python3-pip python3-venv
          python3 --version
          echo "✅ Python installed"

      - name: 📗 Install Node.js & NPM (Latest LTS)
        run: |
          set -e
          echo "📗 Installing Node.js..."
          curl -fsSL https://deb.nodesource.com/setup_lts.x | sudo -E bash -
          sudo apt-get install -y nodejs
          node --version
          npm --version
          echo "✅ Node.js & NPM installed"

      - name: 💻 Install VS Code
        run: |
          set -e
          echo "💻 Installing Visual Studio Code..."
          wget -qO- https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor > packages.microsoft.gpg
          sudo install -D -o root -g root -m 644 packages.microsoft.gpg /etc/apt/keyrings/packages.microsoft.gpg
          sudo sh -c 'echo "deb [arch=amd64,arm64,armhf signed-by=/etc/apt/keyrings/packages.microsoft.gpg] https://packages.microsoft.com/repos/code stable main" > /etc/apt/sources.list.d/vscode.list'
          sudo apt-get update -qq
          sudo apt-get install -y code
          echo "✅ VS Code installed"

      - name: 🌌 Install Google Antigravity IDE (Fail-Safe)
        run: |
          set -e
          echo "🌌 Attempting to install Google Antigravity IDE..."
          
          # Try method 1: Direct .deb download
          if wget -q https://dl.google.com/linux/direct/antigravity-ide_latest_amd64.deb 2>/dev/null; then
            sudo dpkg -i antigravity-ide_latest_amd64.deb || sudo apt-get install -f -y
            echo "✅ Antigravity IDE installed via .deb"
          else
            echo "⚠️  Direct download failed, trying alternative method..."
            
            # Try method 2: Check if there's a snap package
            if sudo snap install antigravity-ide 2>/dev/null; then
              echo "✅ Antigravity IDE installed via snap"
            else
              echo "❌ Antigravity IDE installation failed"
              echo "⚠️  Continuing workflow without Antigravity IDE..."
            fi
          fi

      #━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 🧠 PHASE 5: Smart Backup System - Real-Time Watcher
      #━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      
      - name: 👁️ Start inotify Backup Watcher
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -e
          echo "👁️ Starting real-time backup watcher..."
          
          # Create backup script
          cat <<'EOFSCRIPT' | sudo -u $WORKSPACE_USER tee /home/$WORKSPACE_USER/backup-watcher.sh
#!/bin/bash
set -e

WORKSPACE_DIR="$WORKSPACE_DIR"
WORKSPACE_USER="$WORKSPACE_USER"
BACKUP_REGISTRY_REPO="$BACKUP_REGISTRY_REPO"
GH_TOKEN="$GH_TOKEN"

LOCKFILE="/tmp/backup.lock"
REGISTRY_URL="https://x-access-token:${GH_TOKEN}@github.com/${WORKSPACE_USER}/${BACKUP_REGISTRY_REPO}.git"

# Function to update registry with file locking
update_registry() {
    local PROJECT_NAME=$1
    local PROJECT_REPO="${WORKSPACE_USER}/${PROJECT_NAME}"
    
    exec 200>"$LOCKFILE"
    flock -x 200
    
    cd /tmp
    rm -rf backup-registry-temp
    git clone --depth=1 "$REGISTRY_URL" backup-registry-temp
    cd backup-registry-temp
    
    # Check if already in registry
    if ! grep -q "^- ${PROJECT_REPO}$" README.md; then
        echo "- ${PROJECT_REPO}" >> README.md
        git add README.md
        git commit -m "Add project: ${PROJECT_NAME}"
        git push origin main
        echo "  ✅ Registry updated"
    fi
    
    cd ..
    rm -rf backup-registry-temp
    
    flock -u 200
}

# Function to process new directory
process_new_directory() {
    local DIR_PATH=$1
    local PROJECT_NAME=$(basename "$DIR_PATH")
    
    echo "🔍 Detected new directory: $PROJECT_NAME"
    
    # Debounce: Wait for files to settle
    echo "  ⏳ Waiting 15 seconds for files to settle..."
    sleep 15
    
    # Check if directory has files
    if [ -z "$(ls -A "$DIR_PATH")" ]; then
        echo "  ⚠️  Directory is empty, skipping..."
        return
    fi
    
    echo "  📦 Creating GitHub repository..."
    
    # Create private repo via API
    REPO_RESPONSE=$(curl -s -X POST \
      -H "Authorization: token ${GH_TOKEN}" \
      -H "Accept: application/vnd.github.v3+json" \
      https://api.github.com/user/repos \
      -d "{\"name\":\"${PROJECT_NAME}\",\"private\":true}")
    
    sleep 2
    
    # Initialize git and push
    cd "$DIR_PATH"
    git init
    git add .
    git commit -m "Initial commit from cloud workstation" || true
    git branch -M main
    git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${WORKSPACE_USER}/${PROJECT_NAME}.git"
    
    if git push -u origin main 2>/dev/null; then
        echo "  ✅ Project pushed to GitHub"
        
        # Update registry
        update_registry "$PROJECT_NAME"
    else
        echo "  ❌ Failed to push project"
    fi
}

# Monitor workspace directory
echo "👁️  Watching: $WORKSPACE_DIR"
echo "🔄 Press Ctrl+C to stop"
echo ""

inotifywait -m -e create --format '%w%f' "$WORKSPACE_DIR" | while read NEW_PATH; do
    if [ -d "$NEW_PATH" ]; then
        process_new_directory "$NEW_PATH" &
    fi
done
EOFSCRIPT
          
          # Make executable and substitute variables
          sudo chmod +x /home/$WORKSPACE_USER/backup-watcher.sh
          sudo -u $WORKSPACE_USER bash -c "export WORKSPACE_DIR='$WORKSPACE_DIR' WORKSPACE_USER='$WORKSPACE_USER' BACKUP_REGISTRY_REPO='$BACKUP_REGISTRY_REPO' GH_TOKEN='$GH_TOKEN' && /home/$WORKSPACE_USER/backup-watcher.sh" &
          
          echo "✅ Backup watcher started in background"

      #━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 💚 PHASE 6: Keep-Alive & Health Monitoring
      #━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      
      - name: 💚 Keep Workstation Alive & Monitor
        run: |
          set -e
          echo "💚 Workstation is ready!"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🎯 Your cloud workstation is running!"
          echo "⏱️  Maximum runtime: 6 hours (GitHub Actions limit)"
          echo "🔄 Auto-backup: Enabled (inotify watching $WORKSPACE_DIR)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          
          # Health check function
          check_vnc_health() {
            if ! sudo -u $WORKSPACE_USER vncserver -list | grep -q "$VNC_DISPLAY"; then
              echo "⚠️  VNC server died, restarting..."
              sudo -u $WORKSPACE_USER vncserver $VNC_DISPLAY -geometry 1920x1080 -depth 24
            fi
          }
          
          # Keep alive with periodic health checks
          COUNTER=0
          while true; do
            sleep 30
            COUNTER=$((COUNTER + 1))
            
            # Health check every 30 minutes (60 iterations)
            if [ $((COUNTER % 60)) -eq 0 ]; then
              echo "🏥 Health check at $(date)"
              check_vnc_health
            fi
            
            # Warning at 5.5 hours
            if [ $COUNTER -eq 660 ]; then
              echo "⚠️  WARNING: Approaching 6-hour limit. Workflow will end soon."
            fi
          done

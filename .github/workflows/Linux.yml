name: 🖥️ Ubuntu Cloud Workstation - ABSOLUTE FINAL

on:
  workflow_dispatch:

env:
  WORKSPACE_USER: sandsneha
  WORKSPACE_DIR: /home/sandsneha/Desktop/sand

jobs:
  workstation:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
      - name: 📦 Install Desktop
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y xfce4 xfce4-terminal tigervnc-standalone-server dbus-x11 inotify-tools git curl wget jq
          echo "✅ Installed"

      - name: 👤 Create User
        env:
          PASS: ${{ secrets.VNC_PASSWORD || 'P@ssw0rd123!' }}
        run: |
          sudo useradd -m -s /bin/bash -G sudo sandsneha
          echo "sandsneha:${PASS}" | sudo chpasswd
          echo "sandsneha ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/sandsneha
          sudo chmod 0440 /etc/sudoers.d/sandsneha
          sudo chown -R sandsneha:sandsneha /home/sandsneha

      - name: 🔐 Configure VNC
        env:
          PASS: ${{ secrets.VNC_PASSWORD || 'P@ssw0rd123!' }}
        run: |
          sudo -u sandsneha mkdir -p /home/sandsneha/.vnc
          echo "${PASS}" | sudo -u sandsneha vncpasswd -f > /tmp/p
          sudo mv /tmp/p /home/sandsneha/.vnc/passwd
          sudo chown sandsneha:sandsneha /home/sandsneha/.vnc/passwd
          sudo chmod 600 /home/sandsneha/.vnc/passwd
          
          cat > /tmp/xs << 'EOF'
#!/bin/bash
# Unset session manager variables to avoid conflicts
unset SESSION_MANAGER
unset DBUS_SESSION_BUS_ADDRESS

# Set display
export DISPLAY=:1

# Load X resources if available
[ -r $HOME/.Xresources ] && xrdb $HOME/.Xresources

# Set background color
xsetroot -solid grey

# Start XFCE with dbus-launch to ensure proper D-Bus session
exec dbus-launch --exit-with-session startxfce4
EOF
          
          sudo mv /tmp/xs /home/sandsneha/.vnc/xstartup
          sudo chown sandsneha:sandsneha /home/sandsneha/.vnc/xstartup
          sudo chmod +x /home/sandsneha/.vnc/xstartup
          sudo -u sandsneha mkdir -p /home/sandsneha/Desktop/sand

      - name: 🚀 Start VNC
        run: |
          sudo -u sandsneha touch /home/sandsneha/.Xauthority
          sudo mkdir -p /run/user/$(id -u sandsneha)
          sudo chown sandsneha:sandsneha /run/user/$(id -u sandsneha)
          export XDG_RUNTIME_DIR=/run/user/$(id -u sandsneha)
          sudo -u sandsneha XDG_RUNTIME_DIR=/run/user/$(id -u sandsneha) DISPLAY=:1 vncserver :1 -geometry 1920x1080 -depth 24 -localhost no
          sleep 5
          pgrep Xtigervnc && echo "✅ VNC running" || (cat /home/sandsneha/.vnc/*.log && exit 1)

      - name: ☁️ Cloudflare Tunnel
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          nohup cloudflared tunnel --url tcp://localhost:5901 > /tmp/cf.log 2>&1 &
          sleep 5
          for i in {1..30}; do
            if grep -q "trycloudflare.com" /tmp/cf.log 2>/dev/null; then
              break
            fi
            sleep 2
          done
          H=$(grep -oP 'https://\K[^/]+\.trycloudflare\.com' /tmp/cf.log | head -1)
          echo "$H" > /tmp/cf_hostname.txt
          echo "✅ Cloudflared tunnel started"

      - name: 🐍 Python
        run: sudo apt-get install -y python3 python3-pip python3-venv && python3 --version

      - name: 📗 Node.js
        run: curl -fsSL https://deb.nodesource.com/setup_lts.x | sudo -E bash - && sudo apt-get install -y nodejs && node --version

      - name: 💻 VS Code
        run: |
          wget -qO- https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor > p.gpg
          sudo install -o root -g root -m 644 p.gpg /etc/apt/keyrings/packages.microsoft.gpg
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/packages.microsoft.gpg] https://packages.microsoft.com/repos/code stable main" | sudo tee /etc/apt/sources.list.d/vscode.list
          sudo apt-get update -qq && sudo apt-get install -y code

      - name: 🌌 Antigravity IDE
        run: |
          curl -fsSL https://us-central1-apt.pkg.dev/doc/repo-signing-key.gpg | sudo gpg --dearmor -o /etc/apt/keyrings/ag.gpg
          echo "deb [signed-by=/etc/apt/keyrings/ag.gpg] https://us-central1-apt.pkg.dev/projects/antigravity-auto-updater-dev/ antigravity-debian main" | sudo tee /etc/apt/sources.list.d/ag.list
          sudo apt-get update -qq && sudo apt-get install -y antigravity && antigravity --version

      - name: 🔄 Restore
        env:
          T: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          cd /home/sandsneha
          sudo -u sandsneha git config --global user.name "sandsneha"
          sudo -u sandsneha git config --global user.email "sandsneha@github.com"
          U="https://x-access-token:${T}@github.com/sandsneha/backup-files.git"
          if sudo -u sandsneha git ls-remote "$U" &>/dev/null; then
            sudo -u sandsneha git clone --depth=1 "$U" /tmp/br
            [ -f /tmp/br/README.md ] && grep -oP '^\s*-\s*\K\S+' /tmp/br/README.md | while read r; do
              sudo -u sandsneha git clone --depth=1 "https://x-access-token:${T}@github.com/${r}.git" "/home/sandsneha/Desktop/sand/$(basename $r)" 2>/dev/null || true
            done
            rm -rf /tmp/br
          else
            sudo -u sandsneha mkdir /tmp/nr
            echo '# Backup' | sudo -u sandsneha tee /tmp/nr/README.md
            cd /tmp/nr && sudo -u sandsneha git init && sudo -u sandsneha git add . && sudo -u sandsneha git commit -m "init" && sudo -u sandsneha git branch -M main
            curl -s -X POST -H "Authorization: token ${T}" https://api.github.com/user/repos -d '{"name":"backup-files","private":true}' >/dev/null
            sleep 2 && sudo -u sandsneha git remote add origin "$U" && sudo -u sandsneha git push -u origin main 2>/dev/null || true
            sudo rm -rf /tmp/nr
          fi

      - name: 👁️ Backup Watcher
        env:
          T: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          cat > /tmp/w.sh << 'SCRIPT'
          #!/bin/bash
          D="/home/sandsneha/Desktop/sand"
          U="sandsneha"
          process() {
            N=$(basename "$1")
            sleep 15
            [ -z "$(ls -A "$1")" ] && return
            curl -s -X POST -H "Authorization: token ${T}" https://api.github.com/user/repos -d "{\"name\":\"$N\",\"private\":true}" >/dev/null
            cd "$1" && git init && git add . && git commit -m "init" && git branch -M main
            git remote add origin "https://x-access-token:${T}@github.com/$U/$N.git"
            git push -u origin main 2>/dev/null && {
              flock /tmp/b.lock -c "cd /tmp && rm -rf br && git clone --depth=1 https://x-access-token:${T}@github.com/$U/backup-files.git br && cd br && echo \"- $U/$N\" >> README.md && git add . && git commit -m \"Add $N\" && git push && cd /tmp && rm -rf br" 2>/dev/null
            }
          }
          inotifywait -m -e create --format '%w%f' "$D" | while read P; do
            [ -d "$P" ] && process "$P" &
          done
          SCRIPT
          sudo sed -i "s|\${T}|${T}|g" /tmp/w.sh
          sudo mv /tmp/w.sh /home/sandsneha/w.sh
          sudo chown sandsneha:sandsneha /home/sandsneha/w.sh
          sudo chmod +x /home/sandsneha/w.sh
          sudo -u sandsneha nohup /home/sandsneha/w.sh >/dev/null 2>&1 &

      - name: 💚 Keep Alive
        run: |
          H=$(cat /tmp/cf_hostname.txt 2>/dev/null || echo "")
          echo ""
          echo "═══════════════════════════════════════"
          echo "✅ WORKSTATION READY"
          echo "═══════════════════════════════════════"
          if [ -n "$H" ]; then
            echo "🎯 LOCAL COMMAND:"
            echo "cloudflared access tcp --hostname $H --url 127.0.0.1:5901"
            echo "═══════════════════════════════════════"
            echo "📌 VNC: localhost:5901"
            echo "🔑 Password: Check VNC_PASSWORD secret or default P@ssw0rd123!"
          else
            echo "⚠️  Cloudflare hostname not found"
            echo "Check /tmp/cf.log for details"
          fi
          echo "═══════════════════════════════════════"
          echo ""
          while true; do 
            sleep 3600
            pgrep Xtigervnc || sudo -u sandsneha XDG_RUNTIME_DIR=/run/user/$(id -u sandsneha) vncserver :1 -geometry 1920x1080 -depth 24 -localhost no
          done

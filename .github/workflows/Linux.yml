name: ULTIMATE UBUNTU DEV MACHINE
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 🛠️ Setup Cloudflared
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: 💻 Install Desktop Environment (XFCE & XRDP)
        run: |
          sudo apt-get update
          sudo apt-get install -y xfce4 xfce4-goodies xrdp
          echo "xfce4-session" > ~/.xsession
          sudo systemctl enable xrdp
          sudo systemctl start xrdp
          sudo adduser xrdp ssl-cert

      - name: 👤 Create User & Fix Desktop
        run: |
          # Create User
          sudo useradd -m -s /bin/bash runneradmin
          echo "runneradmin:P@ssw0rd123!" | sudo chpasswd
          sudo usermod -aG sudo runneradmin
          
          # 🟢 IMPORTANT FIX: Manually Create Desktop Folder
          echo "Creating Desktop Directory..."
          sudo mkdir -p /home/runneradmin/Desktop
          sudo chown -R runneradmin:runneradmin /home/runneradmin/Desktop
          sudo chmod 755 /home/runneradmin/Desktop
          echo "✅ Desktop Folder Created!"

      - name: 📦 Install Dev Tools (VS Code, Python, Node)
        run: |
          sudo apt-get install -y git wget unzip curl software-properties-common python3 python3-pip nodejs npm
          sudo snap install code --classic

      - name: 🌌 Install Google Antigravity IDE
        continue-on-error: true
        run: |
          echo "Trying to Install Antigravity..."
          
          # Method 1: Repository Method
          echo "⬇️ Downloading Keys..."
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://us-central1-apt.pkg.dev/doc/repo-signing-key.gpg | sudo gpg --dearmor --yes -o /etc/apt/keyrings/antigravity-repo-key.gpg
          
          echo "📝 Adding Repo..."
          echo "deb [signed-by=/etc/apt/keyrings/antigravity-repo-key.gpg] https://us-central1-apt.pkg.dev/projects/antigravity-auto-updater-dev/ antigravity-debian main" | sudo tee /etc/apt/sources.list.d/antigravity.list
          
          echo "🔄 Updating Apt..."
          sudo apt-get update || echo "Apt update warning (ignoring)..."
          
          # Install Package
          if sudo apt-get install -y antigravity; then
              echo "✅ Installed via APT"
          else
              echo "⚠️ APT Failed. Trying Direct Download..."
              wget -O antigravity.deb "https://us-central1-apt.pkg.dev/projects/antigravity-auto-updater-dev/pool/main/a/antigravity/antigravity_latest_amd64.deb" || echo "Direct link failed"
              if [ -f "antigravity.deb" ]; then
                  sudo dpkg -i antigravity.deb
                  sudo apt-get install -f -y
                  echo "✅ Installed via DEB"
              fi
          fi

          # Create Shortcut
          if [ -d "/home/runneradmin/Desktop" ]; then
              echo "[Desktop Entry]
              Version=1.0
              Type=Application
              Name=Google Antigravity
              Exec=/usr/bin/antigravity %F
              Icon=utilities-terminal
              Terminal=false
              Categories=Development;IDE;" | sudo tee /home/runneradmin/Desktop/Antigravity.desktop > /dev/null
              
              sudo chmod +x /home/runneradmin/Desktop/Antigravity.desktop
              sudo chown runneradmin:runneradmin /home/runneradmin/Desktop/Antigravity.desktop
              echo "✅ Shortcut Created!"
          fi

      - name: 🤖 Setup Intelligent Backup System
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --global user.name "AutoBackupBot"
          git config --global user.email "bot@backup.com"
          
          BASE_DIR="/home/runneradmin/Desktop"
          SAND_DIR="$BASE_DIR/sand"
          MASTER_REPO="backup-files"
          MASTER_PATH="$BASE_DIR/$MASTER_REPO"

          # Create Sand Directory
          sudo mkdir -p "$SAND_DIR"
          sudo chown runneradmin:runneradmin "$SAND_DIR"
          
          # 🟢 REMOVED: 'gh auth login' command. 
          # Environment variable GH_TOKEN works automatically.

          # 1. Check/Create Master Repo
          echo "Checking Master Repo..."
          if gh repo view "$MASTER_REPO" > /dev/null 2>&1; then
              gh repo clone "$MASTER_REPO" "$MASTER_PATH"
          else
              mkdir -p "$MASTER_PATH"
              cd "$MASTER_PATH"
              echo "# Backup Files Registry" > README.md
              git init
              git add README.md
              git commit -m "Initial Commit"
              gh repo create "$MASTER_REPO" --private --source=. --remote=origin --push
          fi

          # 2. Restore Projects
          if [ -f "$MASTER_PATH/README.md" ]; then
              cd "$SAND_DIR"
              while read -r repo_name; do
                  if [[ "$repo_name" == *"/"* ]]; then
                      gh repo clone "$repo_name" || echo "Skipping $repo_name"
                  fi
              done < "$MASTER_PATH/README.md"
          fi
          
          # Fix permissions for restored files
          sudo chown -R runneradmin:runneradmin "$SAND_DIR"

          # 3. Create Watcher Script
          cat << 'EOF' > /home/runneradmin/monitor_backups.sh
          #!/bin/bash
          SAND_DIR="/home/runneradmin/Desktop/sand"
          MASTER_PATH="/home/runneradmin/Desktop/backup-files"
          
          # Setup Git for this user session
          git config --global user.name "AutoBackupBot"
          git config --global user.email "bot@backup.com"

          while true; do
              for d in "$SAND_DIR"/*/; do
                  [ -d "$d" ] || continue
                  FOLDER_NAME=$(basename "$d")
                  
                  # If not in Registry, it's new
                  if ! grep -q "$FOLDER_NAME" "$MASTER_PATH/README.md"; then
                      cd "$d"
                      if [ ! -d ".git" ]; then
                          git init
                          git add .
                          git commit -m "Auto Backup"
                          gh repo create "$FOLDER_NAME" --private --source=. --remote=origin --push
                          
                          # Update Registry
                          FULL_REPO=$(gh repo view --json dependencyProjects --template '{{.owner.login}}')/"$FOLDER_NAME"
                          echo "$FULL_REPO" >> "$MASTER_PATH/README.md"
                          
                          # Push Registry Update
                          cd "$MASTER_PATH"
                          git add README.md
                          git commit -m "Added $FOLDER_NAME"
                          git push origin main
                      fi
                  fi
              done
              sleep 5
          done
          EOF
          
          chmod +x /home/runneradmin/monitor_backups.sh
          sudo chown runneradmin:runneradmin /home/runneradmin/monitor_backups.sh

      - name: 🚀 Start Tunnel & Monitor
        run: |
          cloudflared tunnel --url tcp://localhost:3389 --no-autoupdate > tunnel.log 2>&1 &
          
          # Start Monitor as runneradmin (not root)
          sudo -u runneradmin nohup bash /home/runneradmin/monitor_backups.sh > monitor.log 2>&1 &
          
          echo "⏳ Waiting for Tunnel URL..."
          URL=""
          for i in {1..30}; do
            if grep -q "trycloudflare.com" tunnel.log; then
               URL=$(grep -o 'tcp://.*\.trycloudflare\.com:[0-9]*' tunnel.log | head -n 1)
               break
            fi
            sleep 2
          done

          if [ -z "$URL" ]; then
            tail -n 20 tunnel.log
          else
            echo "✅ SUCCESS! CONNECT: $URL"
            echo "User: runneradmin | Pass: P@ssw0rd123!"
          fi
          
          while true; do sleep 30; done

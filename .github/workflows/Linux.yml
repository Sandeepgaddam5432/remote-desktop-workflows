name: 🖥️ Ubuntu Cloud Workstation

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  WORKSPACE_USER: sandsneha
  VNC_DISPLAY: :1
  VNC_PORT: 5901
  BACKUP_REGISTRY_REPO: backup-files
  WORKSPACE_DIR: /home/sandsneha/Desktop/sand

jobs:
  cloud-workstation:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
      - name: 📦 Install Desktop Environment
        run: |
          set -e
          echo "Installing XFCE4 Desktop & TigerVNC..."
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y xfce4 xfce4-goodies tigervnc-standalone-server tigervnc-common dbus-x11 inotify-tools git curl wget jq
          echo "✅ Desktop installed"

      - name: 👤 Create User
        env:
          USER_PASSWORD: ${{ secrets.VNC_PASSWORD || 'P@ssw0rd123!' }}
        run: |
          set -e
          echo "Creating user: sandsneha"
          sudo useradd -m -s /bin/bash -G sudo sandsneha
          sudo chown -R sandsneha:sandsneha /home/sandsneha
          echo "sandsneha:${USER_PASSWORD}" | sudo chpasswd
          echo "sandsneha ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/sandsneha
          sudo chmod 0440 /etc/sudoers.d/sandsneha
          echo "✅ User created"

      - name: 🔐 Configure VNC
        env:
          USER_PASSWORD: ${{ secrets.VNC_PASSWORD || 'P@ssw0rd123!' }}
        run: |
          set -e
          echo "Configuring VNC..."
          
          sudo -u sandsneha mkdir -p /home/sandsneha/.vnc
          
          echo "${USER_PASSWORD}" | sudo -u sandsneha vncpasswd -f > /tmp/vncpasswd
          sudo mv /tmp/vncpasswd /home/sandsneha/.vnc/passwd
          sudo chown sandsneha:sandsneha /home/sandsneha/.vnc/passwd
          sudo chmod 600 /home/sandsneha/.vnc/passwd
          
          echo '#!/bin/bash' | sudo tee /home/sandsneha/.vnc/xstartup
          echo 'unset SESSION_MANAGER' | sudo tee -a /home/sandsneha/.vnc/xstartup
          echo 'unset DBUS_SESSION_BUS_ADDRESS' | sudo tee -a /home/sandsneha/.vnc/xstartup
          echo 'exec startxfce4' | sudo tee -a /home/sandsneha/.vnc/xstartup
          
          sudo chown sandsneha:sandsneha /home/sandsneha/.vnc/xstartup
          sudo chmod +x /home/sandsneha/.vnc/xstartup
          
          sudo -u sandsneha mkdir -p /home/sandsneha/Desktop/sand
          
          sudo chown -R sandsneha:sandsneha /home/sandsneha
          
          echo "✅ VNC configured"

      - name: 🚀 Start VNC Server
        run: |
          set -e
          echo "Starting VNC Server..."
          
          sudo -u sandsneha vncserver :1 -geometry 1920x1080 -depth 24 -localhost no -SecurityTypes VncAuth
          
          sleep 3
          
          if sudo -u sandsneha vncserver -list | grep -q ":1"; then
            echo "✅ VNC Server running on port 5901"
            sudo -u sandsneha vncserver -list
          else
            echo "❌ VNC failed to start"
            exit 1
          fi

      - name: ☁️ Setup Cloudflare Tunnel
        run: |
          set -e
          echo "Installing cloudflared..."
          
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          rm cloudflared-linux-amd64.deb
          
          echo "Starting tunnel..."
          
          nohup cloudflared tunnel --url tcp://localhost:5901 > /tmp/cloudflare.log 2>&1 &
          
          echo "Waiting for tunnel..."
          TUNNEL_HOST=""
          
          for i in {1..60}; do
            if [ -f /tmp/cloudflare.log ] && grep -q "https://.*trycloudflare.com" /tmp/cloudflare.log; then
              TUNNEL_HOST=$(grep -oP 'https://\K[^/]+\.trycloudflare\.com' /tmp/cloudflare.log | head -1)
              break
            fi
            sleep 1
          done
          
          if [ -z "$TUNNEL_HOST" ]; then
            echo "❌ Tunnel failed"
            cat /tmp/cloudflare.log
            exit 1
          fi
          
          echo ""
          echo "═════════════════════════════════════════════════════════════"
          echo "✅ TUNNEL READY!"
          echo "═════════════════════════════════════════════════════════════"
          echo ""
          echo "🎯 Run on LOCAL machine:"
          echo ""
          echo "cloudflared access tcp --hostname $TUNNEL_HOST --url 127.0.0.1:5901"
          echo ""
          echo "═════════════════════════════════════════════════════════════"
          echo "📌 VNC Viewer: localhost:5901"
          echo "🔑 Password: <your VNC_PASSWORD>"
          echo "═════════════════════════════════════════════════════════════"
          echo ""

      - name: 🔄 Restore Projects
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -e
          echo "Restoring projects..."
          
          sudo -u sandsneha git config --global user.name "sandsneha"
          sudo -u sandsneha git config --global user.email "sandsneha@github.com"
          
          REGISTRY_URL="https://x-access-token:${GH_TOKEN}@github.com/sandsneha/backup-files.git"
          
          if sudo -u sandsneha git ls-remote "$REGISTRY_URL" &>/dev/null; then
            echo "Found backup registry"
            
            sudo -u sandsneha git clone --depth=1 "$REGISTRY_URL" /tmp/backup-registry
            
            if [ -f /tmp/backup-registry/README.md ]; then
              echo "Restoring projects..."
              
              grep -oP '^\s*-\s*\K[a-zA-Z0-9_-]+/[a-zA-Z0-9_-]+' /tmp/backup-registry/README.md | while read repo; do
                PROJECT_NAME=$(basename "$repo")
                PROJECT_URL="https://x-access-token:${GH_TOKEN}@github.com/${repo}.git"
                
                echo "  Restoring: $PROJECT_NAME"
                
                if sudo -u sandsneha git clone --depth=1 "$PROJECT_URL" "/home/sandsneha/Desktop/sand/$PROJECT_NAME" 2>/dev/null; then
                  echo "    ✅ Done"
                else
                  echo "    ⚠️  Skipped"
                fi
              done
            fi
            
            sudo rm -rf /tmp/backup-registry
            
          else
            echo "Creating new registry..."
            
            sudo -u sandsneha mkdir -p /tmp/new-registry
            
            echo '# 🗂️ Backup Registry' | sudo -u sandsneha tee /tmp/new-registry/README.md
            echo '' | sudo -u sandsneha tee -a /tmp/new-registry/README.md
            echo 'Auto-managed project list.' | sudo -u sandsneha tee -a /tmp/new-registry/README.md
            echo '' | sudo -u sandsneha tee -a /tmp/new-registry/README.md
            echo '## Projects:' | sudo -u sandsneha tee -a /tmp/new-registry/README.md
            echo '' | sudo -u sandsneha tee -a /tmp/new-registry/README.md
            
            cd /tmp/new-registry
            sudo -u sandsneha git init
            sudo -u sandsneha git add README.md
            sudo -u sandsneha git commit -m "Initialize backup registry"
            sudo -u sandsneha git branch -M main
            
            curl -s -X POST -H "Authorization: token ${GH_TOKEN}" -H "Accept: application/vnd.github.v3+json" https://api.github.com/user/repos -d '{"name":"backup-files","private":true}' > /dev/null 2>&1 || true
            
            sleep 3
            
            sudo -u sandsneha git remote add origin "$REGISTRY_URL"
            sudo -u sandsneha git push -u origin main 2>/dev/null || echo "⚠️  Push timed out"
            
            cd /
            sudo rm -rf /tmp/new-registry
            
            echo "✅ Registry created"
          fi
          
          echo "✅ Restore done"

      - name: 🐍 Install Python
        run: |
          set -e
          echo "Installing Python..."
          sudo apt-get install -y python3 python3-pip python3-venv
          python3 --version
          echo "✅ Python ready"

      - name: 📗 Install Node.js
        run: |
          set -e
          echo "Installing Node.js..."
          curl -fsSL https://deb.nodesource.com/setup_lts.x | sudo -E bash -
          sudo apt-get install -y nodejs
          node --version
          npm --version
          echo "✅ Node.js ready"

      - name: 💻 Install VS Code
        run: |
          set -e
          echo "Installing VS Code..."
          wget -qO- https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor > packages.microsoft.gpg
          sudo install -D -o root -g root -m 644 packages.microsoft.gpg /etc/apt/keyrings/packages.microsoft.gpg
          sudo sh -c 'echo "deb [arch=amd64,arm64,armhf signed-by=/etc/apt/keyrings/packages.microsoft.gpg] https://packages.microsoft.com/repos/code stable main" > /etc/apt/sources.list.d/vscode.list'
          rm packages.microsoft.gpg
          sudo apt-get update -qq
          sudo apt-get install -y code
          echo "✅ VS Code ready"

      - name: 🌌 Install Antigravity IDE
        run: |
          set +e
          echo "Attempting Antigravity IDE..."
          
          if wget -q --timeout=10 https://dl.google.com/linux/direct/antigravity-ide_latest_amd64.deb 2>/dev/null; then
            sudo dpkg -i antigravity-ide_latest_amd64.deb 2>/dev/null
            sudo apt-get install -f -y 2>/dev/null
            if command -v antigravity-ide &> /dev/null; then
              echo "✅ Installed"
            else
              echo "⚠️  Skipped"
            fi
          else
            sudo snap install antigravity-ide 2>/dev/null && echo "✅ Installed" || echo "⚠️  Not available"
          fi
          
          exit 0

      - name: 👁️ Deploy Backup Watcher
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -e
          echo "Creating backup watcher..."
          
          cat > /tmp/backup-watcher.sh << 'ENDSCRIPT'
#!/bin/bash
set -e

WORKSPACE_DIR="/home/sandsneha/Desktop/sand"
WORKSPACE_USER="sandsneha"
BACKUP_REGISTRY_REPO="backup-files"
LOCKFILE="/tmp/backup.lock"

update_registry() {
    local PROJECT_NAME=$1
    local PROJECT_REPO="${WORKSPACE_USER}/${PROJECT_NAME}"
    local REGISTRY_URL="https://x-access-token:${GH_TOKEN}@github.com/${WORKSPACE_USER}/${BACKUP_REGISTRY_REPO}.git"
    
    exec 200>"$LOCKFILE"
    flock -x 200
    
    cd /tmp
    rm -rf backup-registry-temp
    git clone --depth=1 "$REGISTRY_URL" backup-registry-temp 2>/dev/null || {
        flock -u 200
        return 1
    }
    
    cd backup-registry-temp
    
    if ! grep -q "^- ${PROJECT_REPO}$" README.md 2>/dev/null; then
        echo "- ${PROJECT_REPO}" >> README.md
        git add README.md
        git commit -m "Add project: ${PROJECT_NAME}"
        git push origin main 2>/dev/null
        echo "  ✅ Registry updated"
    fi
    
    cd /tmp
    rm -rf backup-registry-temp
    flock -u 200
}

process_new_directory() {
    local DIR_PATH=$1
    local PROJECT_NAME=$(basename "$DIR_PATH")
    local PROJECT_URL="https://x-access-token:${GH_TOKEN}@github.com/${WORKSPACE_USER}/${PROJECT_NAME}.git"
    
    echo ""
    echo "New directory: $PROJECT_NAME"
    echo "  Waiting 15s..."
    sleep 15
    
    if [ -z "$(ls -A "$DIR_PATH" 2>/dev/null)" ]; then
        echo "  Empty, skipping"
        return
    fi
    
    echo "  Creating repo..."
    
    curl -s -X POST -H "Authorization: token ${GH_TOKEN}" -H "Accept: application/vnd.github.v3+json" https://api.github.com/user/repos -d "{\"name\":\"${PROJECT_NAME}\",\"private\":true}" > /dev/null 2>&1
    
    sleep 3
    
    cd "$DIR_PATH"
    
    if [ ! -d .git ]; then
        git init
        git add .
        git commit -m "Initial commit" 2>/dev/null || return
        git branch -M main
        git remote add origin "$PROJECT_URL"
    fi
    
    if git push -u origin main 2>/dev/null; then
        echo "  ✅ Pushed"
        update_registry "$PROJECT_NAME"
    else
        echo "  ❌ Failed"
    fi
}

echo "Backup watcher active"
echo "Monitoring: $WORKSPACE_DIR"

inotifywait -m -e create --format '%w%f' "$WORKSPACE_DIR" 2>/dev/null | while read NEW_PATH; do
    if [ -d "$NEW_PATH" ]; then
        process_new_directory "$NEW_PATH" &
    fi
done
ENDSCRIPT
          
          sudo sed -i "s|\${GH_TOKEN}|${GH_TOKEN}|g" /tmp/backup-watcher.sh
          
          sudo mv /tmp/backup-watcher.sh /home/sandsneha/backup-watcher.sh
          sudo chown sandsneha:sandsneha /home/sandsneha/backup-watcher.sh
          sudo chmod +x /home/sandsneha/backup-watcher.sh
          
          if [ ! -f /home/sandsneha/backup-watcher.sh ]; then
            echo "❌ Script failed"
            exit 1
          fi
          
          sudo -u sandsneha nohup /home/sandsneha/backup-watcher.sh > /tmp/backup-watcher.log 2>&1 &
          
          sleep 2
          
          echo "✅ Watcher running"

      - name: 💚 Keep Alive
        run: |
          set -e
          
          echo ""
          echo "═════════════════════════════════════════════════════════════"
          echo "✅ WORKSTATION READY!"
          echo "═════════════════════════════════════════════════════════════"
          echo ""
          echo "Status:"
          echo "  • VNC: Port 5901"
          echo "  • Tunnel: Active"
          echo "  • Backup: Monitoring /home/sandsneha/Desktop/sand"
          echo "  • Max Runtime: 6 hours"
          echo ""
          echo "═════════════════════════════════════════════════════════════"
          echo ""
          
          check_health() {
            if ! sudo -u sandsneha vncserver -list | grep -q ":1"; then
              echo "⚠️  Restarting VNC..."
              sudo -u sandsneha vncserver :1 -geometry 1920x1080 -depth 24 -localhost no
            fi
            
            if ! pgrep -f "backup-watcher.sh" > /dev/null; then
              echo "⚠️  Restarting watcher..."
              sudo -u sandsneha nohup /home/sandsneha/backup-watcher.sh > /tmp/backup-watcher.log 2>&1 &
            fi
          }
          
          COUNTER=0
          while true; do
            sleep 30
            COUNTER=$((COUNTER + 1))
            
            if [ $((COUNTER % 60)) -eq 0 ]; then
              HOURS=$((COUNTER / 120))
              echo "Health check (${HOURS}h runtime)"
              check_health
            fi
            
            if [ $COUNTER -eq 660 ]; then
              echo ""
              echo "⚠️  WARNING: ~30min remaining"
              echo "Work auto-backed up to GitHub"
              echo ""
            fi
          done

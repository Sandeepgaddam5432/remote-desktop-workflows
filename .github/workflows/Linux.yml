name: ULTIMATE UBUNTU WORKSTATION
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # ========================================
      # STEP 1: Cloudflared Installation
      # ========================================
      - name: 🛠️ Setup Cloudflared
        run: |
          echo "📥 Installing Cloudflared..."
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          echo "✅ Cloudflared Installed Successfully!"

      # ========================================
      # STEP 2: Desktop Environment Setup
      # ========================================
      - name: 💻 Install Desktop Environment (XFCE & XRDP)
        run: |
          echo "📦 Installing XFCE Desktop & XRDP..."
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y xfce4 xfce4-goodies xrdp dbus-x11
          
          # Configure XRDP for proper session handling
          sudo systemctl enable xrdp
          sudo systemctl start xrdp
          sudo adduser xrdp ssl-cert
          
          # Fix XRDP startup script for XFCE
          sudo sed -i 's/^test -x \/etc\/X11\/Xsession && exec \/etc\/X11\/Xsession/startxfce4/g' /etc/xrdp/startwm.sh
          
          echo "✅ Desktop Environment Ready!"

      # ========================================
      # STEP 3: User Creation & Session Fix
      # ========================================
      - name: 👤 Create User 'sandsneha' & Fix Session
        run: |
          echo "👤 Creating user account..."
          
          # Create user with proper shell
          sudo useradd -m -s /bin/bash sandsneha
          echo "sandsneha:P@ssw0rd123!" | sudo chpasswd
          sudo usermod -aG sudo sandsneha
          
          # Create working directories
          sudo mkdir -p /home/sandsneha/Desktop/sand
          sudo mkdir -p /home/sandsneha/.config/xfce4
          
          # 🟢 CRITICAL FIX: Prevent "Failsafe Session" error
          echo "startxfce4" | sudo tee /home/sandsneha/.xsession
          sudo chmod +x /home/sandsneha/.xsession
          
          # Create .xsessionrc for additional stability
          echo "export XDG_SESSION_TYPE=x11" | sudo tee /home/sandsneha/.xsessionrc
          echo "export XDG_CURRENT_DESKTOP=XFCE" | sudo tee -a /home/sandsneha/.xsessionrc
          
          # Set proper ownership
          sudo chown -R sandsneha:sandsneha /home/sandsneha
          
          echo "✅ User 'sandsneha' created with session fixes applied!"

      # ========================================
      # STEP 4: Development Tools Installation
      # ========================================
      - name: 📦 Install Development Tools
        run: |
          echo "🔧 Installing Python, Node.js, Git, VS Code..."
          
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            git wget unzip curl software-properties-common \
            python3 python3-pip python3-venv \
            nodejs npm \
            build-essential
          
          # Install VS Code
          sudo snap install code --classic
          
          # Configure Git
          git config --global advice.defaultBranchName false
          git config --global init.defaultBranch main
          
          echo "✅ Development tools installed!"
          echo "📌 Versions:"
          python3 --version
          node --version
          npm --version
          code --version

      # ========================================
      # STEP 5: Google Antigravity IDE Installation
      # ========================================
      - name: 🌌 Install Google Antigravity IDE
        continue-on-error: true
        run: |
          echo "🚀 Installing Google Antigravity IDE..."
          
          # Method 1: Try APT Repository
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://us-central1-apt.pkg.dev/doc/repo-signing-key.gpg | sudo gpg --dearmor --yes -o /etc/apt/keyrings/antigravity-repo-key.gpg
          echo "deb [signed-by=/etc/apt/keyrings/antigravity-repo-key.gpg] https://us-central1-apt.pkg.dev/projects/antigravity-auto-updater-dev antigravity-debian main" | sudo tee /etc/apt/sources.list.d/antigravity.list
          
          sudo apt-get update 2>&1 | grep -v "Skipping" || true
          
          if sudo DEBIAN_FRONTEND=noninteractive apt-get install -y antigravity 2>/dev/null; then
              echo "✅ Antigravity installed via APT!"
              ANTIGRAVITY_INSTALLED=true
          else
              echo "⚠️ APT method failed. Trying direct DEB download..."
              
              # Method 2: Direct DEB file download
              wget -O antigravity.deb "https://us-central1-apt.pkg.dev/projects/antigravity-auto-updater-dev/pool/main/a/antigravity/antigravity_latest_amd64.deb" 2>/dev/null || \
              curl -L -o antigravity.deb "https://us-central1-apt.pkg.dev/projects/antigravity-auto-updater-dev/pool/main/a/antigravity/antigravity_latest_amd64.deb" 2>/dev/null || \
              echo "❌ Download failed"
              
              if [ -f "antigravity.deb" ] && [ -s "antigravity.deb" ]; then
                  sudo dpkg -i antigravity.deb || true
                  sudo apt-get install -f -y
                  echo "✅ Antigravity installed via DEB file!"
                  ANTIGRAVITY_INSTALLED=true
              else
                  echo "❌ Antigravity installation failed. Continuing without it..."
                  ANTIGRAVITY_INSTALLED=false
              fi
          fi
          
          # Create desktop shortcut if installation succeeded
          if [ "$ANTIGRAVITY_INSTALLED" = true ]; then
              sudo tee /home/sandsneha/Desktop/Antigravity.desktop > /dev/null << 'EOF'
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Google Antigravity IDE
          Exec=/usr/bin/antigravity %F
          Icon=applications-development
          Terminal=false
          Categories=Development;IDE;
          EOF
              sudo chmod +x /home/sandsneha/Desktop/Antigravity.desktop
              sudo chown sandsneha:sandsneha /home/sandsneha/Desktop/Antigravity.desktop
              echo "✅ Desktop shortcut created!"
          fi

      # ========================================
      # STEP 6: Intelligent Backup System Setup
      # ========================================
      - name: 🤖 Setup Intelligent Backup System
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "🔧 Configuring Git and Backup System..."
          
          git config --global user.name "AutoBackupBot"
          git config --global user.email "bot@backup.com"
          git config --global init.defaultBranch main
          
          BASE_DIR="/home/sandsneha/Desktop"
          SAND_DIR="$BASE_DIR/sand"
          MASTER_REPO="backup-files"
          MASTER_PATH="$BASE_DIR/$MASTER_REPO"
          
          # Ensure sand directory exists
          sudo mkdir -p "$SAND_DIR"
          
          # Initialize or clone master backup repository
          if gh repo view "$MASTER_REPO" > /dev/null 2>&1; then
              echo "📥 Cloning existing backup registry..."
              gh repo clone "$MASTER_REPO" "$MASTER_PATH" || mkdir -p "$MASTER_PATH"
          else
              echo "📝 Creating new backup registry..."
              mkdir -p "$MASTER_PATH"
              cd "$MASTER_PATH"
              echo "# Backup Files Registry" > README.md
              echo "# Auto-generated by backup system" >> README.md
              echo "" >> README.md
              git init
              git add README.md
              git commit -m "Initial Commit: Backup Registry Created"
              gh repo create "$MASTER_REPO" --private --source=. --remote=origin --push || echo "⚠️ Repo creation skipped"
          fi
          
          # Restore existing projects from registry
          if [ -f "$MASTER_PATH/README.md" ]; then
              echo "♻️ Restoring backed up projects..."
              cd "$SAND_DIR"
              grep -E "^[a-zA-Z0-9_-]+/[a-zA-Z0-9_-]+$" "$MASTER_PATH/README.md" | while read -r repo_name; do
                  if [[ -n "$repo_name" ]]; then
                      echo "  → Restoring $repo_name"
                      gh repo clone "$repo_name" 2>/dev/null || echo "    ⚠️ Skipped $repo_name"
                  fi
              done
          fi
          
          # Create CPU-efficient monitoring script
          sudo tee /home/sandsneha/monitor_backups.sh > /dev/null << 'EOFSCRIPT'
          #!/bin/bash
          
          # Configuration
          SAND_DIR="/home/sandsneha/Desktop/sand"
          MASTER_PATH="/home/sandsneha/Desktop/backup-files"
          SLEEP_INTERVAL=30  # Check every 30 seconds (CPU efficient)
          
          # Setup git config for this script
          git config --global user.name "AutoBackupBot"
          git config --global user.email "bot@backup.com"
          git config --global init.defaultBranch main
          
          echo "🔄 Backup Monitor Started (checking every ${SLEEP_INTERVAL}s)"
          
          while true; do
              # Only process if sand directory exists
              if [ ! -d "$SAND_DIR" ]; then
                  sleep "$SLEEP_INTERVAL"
                  continue
              fi
              
              # Iterate through folders in sand directory
              for folder_path in "$SAND_DIR"/*; do
                  # Skip if not a directory
                  [ -d "$folder_path" ] || continue
                  
                  FOLDER_NAME=$(basename "$folder_path")
                  
                  # Skip hidden folders and master repo
                  [[ "$FOLDER_NAME" == .* ]] && continue
                  [[ "$FOLDER_NAME" == "backup-files" ]] && continue
                  
                  # Check if already tracked in registry
                  if ! grep -qF "$FOLDER_NAME" "$MASTER_PATH/README.md" 2>/dev/null; then
                      echo "📦 New folder detected: $FOLDER_NAME"
                      
                      cd "$folder_path" || continue
                      
                      # Initialize git if not already
                      if [ ! -d ".git" ]; then
                          echo "  → Initializing git repository..."
                          git init -q
                          git add . 2>/dev/null
                          git commit -q -m "Auto Backup: Initial commit" || continue
                          
                          # Create private GitHub repository
                          echo "  → Creating GitHub repository..."
                          if gh repo create "$FOLDER_NAME" --private --source=. --remote=origin --push 2>/dev/null; then
                              # Get full repository name
                              REPO_OWNER=$(gh api user --jq '.login' 2>/dev/null || echo "unknown")
                              FULL_REPO="$REPO_OWNER/$FOLDER_NAME"
                              
                              # Add to registry
                              echo "$FULL_REPO" >> "$MASTER_PATH/README.md"
                              
                              # Commit registry update
                              cd "$MASTER_PATH"
                              git add README.md
                              git commit -q -m "Added: $FOLDER_NAME" 2>/dev/null
                              git push origin main -q 2>/dev/null || true
                              
                              echo "  ✅ Backed up: $FULL_REPO"
                          else
                              echo "  ⚠️ Failed to create repo for $FOLDER_NAME"
                          fi
                      fi
                  fi
              done
              
              # Sleep to prevent CPU overuse
              sleep "$SLEEP_INTERVAL"
          done
          EOFSCRIPT
          
          sudo chmod +x /home/sandsneha/monitor_backups.sh
          sudo chown sandsneha:sandsneha /home/sandsneha/monitor_backups.sh
          
          echo "✅ Backup system configured!"

      # ========================================
      # STEP 7: Start Tunnel & Display Connection Info
      # ========================================
      - name: 🚀 Start Cloudflare Tunnel & Monitor
        run: |
          echo "🔧 Setting final permissions..."
          sudo chown -R sandsneha:sandsneha /home/sandsneha
          
          # Start backup monitor in background (as user sandsneha)
          echo "🤖 Starting backup monitor..."
          sudo -u sandsneha nohup bash /home/sandsneha/monitor_backups.sh > /home/sandsneha/monitor.log 2>&1 &
          
          # Start Cloudflare tunnel in background
          echo "🌐 Starting Cloudflare Tunnel..."
          cloudflared tunnel --url tcp://localhost:3389 --no-autoupdate --logfile tunnel.log > /dev/null 2>&1 &
          
          echo ""
          echo "⏳ Waiting for tunnel to establish..."
          
          # Wait for tunnel URL with timeout
          MAX_RETRIES=120
          COUNT=0
          TUNNEL_URL=""
          HOSTNAME=""
          
          while [ $COUNT -lt $MAX_RETRIES ]; do
              if [ -f "tunnel.log" ]; then
                  # Extract full tunnel URL
                  TUNNEL_URL=$(grep -oE "https://[a-zA-Z0-9-]+\.trycloudflare\.com" tunnel.log | head -n 1)
                  
                  if [ -n "$TUNNEL_URL" ]; then
                      # Extract hostname from URL
                      HOSTNAME=$(echo "$TUNNEL_URL" | sed 's|https://||' | sed 's|/.*||')
                      
                      echo ""
                      echo "╔════════════════════════════════════════════════════════════════╗"
                      echo "║                                                                ║"
                      echo "║          ✅ UBUNTU WORKSTATION READY FOR CONNECTION            ║"
                      echo "║                                                                ║"
                      echo "╟────────────────────────────────────────────────────────────────╢"
                      echo "║  🌐 TUNNEL URL:                                                ║"
                      echo "║     $TUNNEL_URL                            ║"
                      echo "║                                                                ║"
                      echo "║  👤 USERNAME: sandsneha                                        ║"
                      echo "║  🔑 PASSWORD: P@ssw0rd123!                                     ║"
                      echo "║                                                                ║"
                      echo "╟────────────────────────────────────────────────────────────────╢"
                      echo "║  🖥️  LOCAL CONNECTION COMMAND:                                 ║"
                      echo "║                                                                ║"
                      echo "║  cloudflared access tcp --hostname $HOSTNAME --url 127.0.0.1:3389  ║"
                      echo "║                                                                ║"
                      echo "╟────────────────────────────────────────────────────────────────╢"
                      echo "║  📝 INSTRUCTIONS:                                              ║"
                      echo "║  1. Copy the command above                                     ║"
                      echo "║  2. Run it in your local terminal                              ║"
                      echo "║  3. Connect RDP to 127.0.0.1:3389                              ║"
                      echo "║  4. Login with username/password shown above                   ║"
                      echo "║                                                                ║"
                      echo "╚════════════════════════════════════════════════════════════════╝"
                      echo ""
                      
                      break
                  fi
              fi
              
              sleep 1
              COUNT=$((COUNT+1))
              
              # Progress indicator every 10 seconds
              if [ $((COUNT % 10)) -eq 0 ]; then
                  echo "  ⏳ Still waiting... (${COUNT}s elapsed)"
              fi
          done
          
          # Error handling if URL not found
          if [ -z "$TUNNEL_URL" ]; then
              echo ""
              echo "❌ ERROR: Tunnel URL not found after ${MAX_RETRIES} seconds"
              echo ""
              echo "📋 Tunnel Log Contents:"
              echo "════════════════════════════════════════"
              cat tunnel.log
              echo "════════════════════════════════════════"
              echo ""
              echo "🔍 Debugging Information:"
              echo "  - XRDP Status:"
              sudo systemctl status xrdp --no-pager | head -20
              echo ""
              echo "  - Cloudflared Process:"
              ps aux | grep cloudflared
          fi
          
          # Keep workflow running
          echo ""
          echo "🔄 Keeping session alive..."
          while true; do 
              sleep 30
              # Optional: periodic health check
              if ! pgrep -x "cloudflared" > /dev/null; then
                  echo "⚠️ Warning: Cloudflared process died!"
              fi
          done

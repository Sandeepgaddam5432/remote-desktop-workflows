name: 🖥️ Ubuntu Cloud Workstation - Production Ready

on:
  workflow_dispatch:

env:
  VNC_DISPLAY: ':1'
  VNC_GEOMETRY: '1920x1080'
  VNC_DEPTH: '24'
  DESKTOP_DIR: '$HOME/Desktop/workspace'
  BACKUP_REPO: 'backup-files'

jobs:
  workstation:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
      - name: 📦 Install MATE Desktop & VNC
        run: |
          echo "🔄 Installing desktop environment..."
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            mate-desktop-environment-core \
            mate-terminal \
            tigervnc-standalone-server \
            tigervnc-common \
            dbus-x11 \
            inotify-tools \
            git curl wget jq \
            firefox
          echo "✅ Desktop installed successfully"

      - name: 🔐 Configure VNC Server
        run: |
          echo "🔄 Configuring VNC..."
          
          # Set VNC password
          VNC_PASS="${{ secrets.VNC_PASSWORD }}"
          if [ -z "$VNC_PASS" ]; then
            VNC_PASS="P@ssw0rd123!"
          fi
          
          mkdir -p ~/.vnc
          echo "$VNC_PASS" | vncpasswd -f > ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd
          
          # Create MATE desktop config directories
          mkdir -p ~/.config/{caja,mate}
          mkdir -p ~/.local/share
          
          # Create VNC startup script
          cat > ~/.vnc/xstartup << 'EOF'
          #!/bin/sh
          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS
          export XKL_XMODMAP_DISABLE=1
          export XDG_CURRENT_DESKTOP="MATE"
          export XDG_SESSION_TYPE=x11
          
          [ -x /etc/vnc/xstartup ] && exec /etc/vnc/xstartup
          [ -r $HOME/.Xresources ] && xrdb $HOME/.Xresources
          
          xsetroot -solid grey
          vncconfig -iconic &
          exec mate-session
          EOF
          
          chmod +x ~/.vnc/xstartup
          
          # Create workspace directory
          mkdir -p ~/Desktop/workspace
          
          echo "✅ VNC configured successfully"

      - name: 🚀 Start VNC Server
        run: |
          echo "🔄 Starting VNC server..."
          
          # Ensure XDG runtime directory exists
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          
          # Start VNC server
          vncserver ${{ env.VNC_DISPLAY }} \
            -geometry ${{ env.VNC_GEOMETRY }} \
            -depth ${{ env.VNC_DEPTH }} \
            -localhost no
          
          sleep 5
          
          # Verify VNC is running
          if pgrep -f "Xtigervnc.*${{ env.VNC_DISPLAY }}" > /dev/null; then
            echo "✅ VNC Server is running on ${{ env.VNC_DISPLAY }}"
          else
            echo "❌ VNC Server failed to start"
            echo "📋 VNC Logs:"
            cat ~/.vnc/*.log 2>/dev/null || echo "No logs found"
            exit 1
          fi

      - name: ☁️ Setup Cloudflare Tunnel
        run: |
          echo "🔄 Setting up Cloudflare tunnel..."
          
          # Install cloudflared
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          rm cloudflared-linux-amd64.deb
          
          # Start tunnel
          cloudflared tunnel --url tcp://localhost:5901 > /tmp/cloudflare.log 2>&1 &
          
          # Wait for tunnel to establish
          sleep 10
          
          # Extract hostname
          for i in {1..40}; do
            if grep -q "https://" /tmp/cloudflare.log 2>/dev/null; then
              HOSTNAME=$(grep -oP "https://\K[^[:space:]]+" /tmp/cloudflare.log | grep trycloudflare.com | head -1)
              if [ -n "$HOSTNAME" ]; then
                echo "$HOSTNAME" > /tmp/cf_host.txt
                echo "✅ Cloudflare tunnel created: $HOSTNAME"
                break
              fi
            fi
            sleep 2
          done
          
          if [ ! -f /tmp/cf_host.txt ]; then
            echo "⚠️  Cloudflare tunnel initialization in progress..."
            echo "📋 Cloudflare Logs:"
            head -20 /tmp/cloudflare.log 2>/dev/null || echo "Logs not yet available"
          fi

      - name: 🐍 Install Python Environment
        run: |
          echo "🔄 Installing Python..."
          sudo apt-get install -y python3 python3-pip python3-venv
          python3 --version
          pip3 --version
          echo "✅ Python installed"

      - name: 📗 Install Node.js Environment
        run: |
          echo "🔄 Installing Node.js..."
          curl -fsSL https://deb.nodesource.com/setup_lts.x | sudo -E bash -
          sudo apt-get install -y nodejs
          node --version
          npm --version
          echo "✅ Node.js installed"

      - name: 💻 Install VS Code
        run: |
          echo "🔄 Installing VS Code..."
          wget -qO- https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor > /tmp/packages.microsoft.gpg
          sudo install -D -o root -g root -m 644 /tmp/packages.microsoft.gpg /etc/apt/keyrings/packages.microsoft.gpg
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/packages.microsoft.gpg] https://packages.microsoft.com/repos/code stable main" | \
            sudo tee /etc/apt/sources.list.d/vscode.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y code
          rm /tmp/packages.microsoft.gpg
          code --version
          echo "✅ VS Code installed"

      - name: 🌌 Install Antigravity IDE
        run: |
          echo "🔄 Installing Antigravity IDE..."
          curl -fsSL https://us-central1-apt.pkg.dev/doc/repo-signing-key.gpg | \
            sudo gpg --dearmor -o /etc/apt/keyrings/antigravity.gpg
          echo "deb [signed-by=/etc/apt/keyrings/antigravity.gpg] https://us-central1-apt.pkg.dev/projects/antigravity-auto-updater-dev/ antigravity-debian main" | \
            sudo tee /etc/apt/sources.list.d/antigravity.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y antigravity
          antigravity --version
          echo "✅ Antigravity IDE installed"

      - name: ⚙️ Configure Git
        run: |
          echo "🔄 Configuring Git..."
          git config --global user.name "${GITHUB_ACTOR}"
          git config --global user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git config --global init.defaultBranch main
          echo "✅ Git configured for user: ${GITHUB_ACTOR}"

      - name: 🔄 Restore Projects from Backup
        run: |
          echo "🔄 Setting up backup restoration..."
          
          # Determine which token to use
          TOKEN="${{ secrets.GH_TOKEN }}"
          if [ -z "$TOKEN" ]; then
            TOKEN="${{ secrets.GITHUB_TOKEN }}"
          fi
          
          BACKUP_REPO_URL="https://x-access-token:${TOKEN}@github.com/${GITHUB_ACTOR}/${{ env.BACKUP_REPO }}.git"
          
          # Check if backup repository exists
          if git ls-remote "$BACKUP_REPO_URL" &>/dev/null; then
            echo "📥 Backup repository found, restoring projects..."
            
            git clone --depth=1 "$BACKUP_REPO_URL" /tmp/backup-temp
            
            if [ -f /tmp/backup-temp/README.md ]; then
              # Extract repository names from README
              grep -oP '^\s*-\s*\K\S+' /tmp/backup-temp/README.md | while read REPO_PATH; do
                REPO_NAME=$(basename "$REPO_PATH")
                echo "  📦 Restoring: $REPO_NAME"
                
                git clone --depth=1 \
                  "https://x-access-token:${TOKEN}@github.com/${REPO_PATH}.git" \
                  "$HOME/Desktop/workspace/${REPO_NAME}" 2>/dev/null || \
                  echo "    ⚠️  Failed to restore $REPO_NAME"
              done
            fi
            
            rm -rf /tmp/backup-temp
            echo "✅ Projects restored successfully"
            
          else
            echo "📝 No existing backup found, creating new backup repository..."
            
            # Create initial backup repository
            mkdir -p /tmp/new-backup
            echo "# Backup Repository" > /tmp/new-backup/README.md
            echo "" >> /tmp/new-backup/README.md
            echo "This repository tracks all backed-up projects." >> /tmp/new-backup/README.md
            echo "" >> /tmp/new-backup/README.md
            echo "## Projects" >> /tmp/new-backup/README.md
            
            cd /tmp/new-backup
            git init
            git add .
            git commit -m "Initial commit"
            git branch -M main
            
            # Create repository via GitHub API
            curl -s -X POST \
              -H "Authorization: token ${TOKEN}" \
              -H "Content-Type: application/json" \
              https://api.github.com/user/repos \
              -d "{\"name\":\"${{ env.BACKUP_REPO }}\",\"private\":true,\"description\":\"Automated project backups\"}" \
              > /dev/null
            
            sleep 3
            
            # Push to GitHub
            git remote add origin "$BACKUP_REPO_URL"
            git push -u origin main 2>/dev/null || \
              echo "⚠️  Initial push failed (repository may need time to initialize)"
            
            cd ~
            rm -rf /tmp/new-backup
            echo "✅ Backup repository created"
          fi

      - name: 👁️ Start Backup Watcher Service
        run: |
          echo "🔄 Setting up backup watcher..."
          
          # Determine which token to use
          TOKEN="${{ secrets.GH_TOKEN }}"
          if [ -z "$TOKEN" ]; then
            TOKEN="${{ secrets.GITHUB_TOKEN }}"
          fi
          
          # Create backup watcher script
          cat > ~/backup-watcher.sh << 'EOF'
          #!/bin/bash
          
          WATCH_DIR="$HOME/Desktop/workspace"
          GITHUB_USER="${GITHUB_ACTOR}"
          BACKUP_REPO="backup-files"
          TOKEN="TOKEN_PLACEHOLDER"
          
          process_new_folder() {
            local FOLDER_PATH="$1"
            local FOLDER_NAME=$(basename "$FOLDER_PATH")
            
            # Wait for folder to settle
            sleep 15
            
            # Skip if folder is empty
            if [ -z "$(ls -A "$FOLDER_PATH")" ]; then
              echo "⏭️  Skipping empty folder: $FOLDER_NAME"
              return
            fi
            
            echo "📤 Processing new project: $FOLDER_NAME"
            
            # Create GitHub repository
            curl -s -X POST \
              -H "Authorization: token $TOKEN" \
              -H "Content-Type: application/json" \
              https://api.github.com/user/repos \
              -d "{\"name\":\"$FOLDER_NAME\",\"private\":true}" > /dev/null
            
            sleep 2
            
            # Initialize git and push
            cd "$FOLDER_PATH"
            git init
            git add .
            git commit -m "Initial commit" 2>/dev/null
            git branch -M main
            git remote add origin "https://x-access-token:$TOKEN@github.com/$GITHUB_USER/$FOLDER_NAME.git"
            
            if git push -u origin main 2>/dev/null; then
              echo "  ✅ Pushed to GitHub: $FOLDER_NAME"
              
              # Update backup repository index
              flock ~/backup.lock -c "
                cd ~
                rm -rf /tmp/backup-list-update
                git clone --depth=1 https://x-access-token:$TOKEN@github.com/$GITHUB_USER/$BACKUP_REPO.git /tmp/backup-list-update
                cd /tmp/backup-list-update
                echo '- $GITHUB_USER/$FOLDER_NAME' >> README.md
                git add README.md
                git commit -m 'Add $FOLDER_NAME to backup index'
                git push
                cd ~
                rm -rf /tmp/backup-list-update
              " 2>/dev/null
              
              echo "  ✅ Updated backup index"
            else
              echo "  ❌ Failed to push: $FOLDER_NAME"
            fi
          }
          
          export -f process_new_folder
          
          # Watch for new directories
          echo "👁️  Watching: $WATCH_DIR"
          inotifywait -m -e create --format '%w%f' "$WATCH_DIR" | while read NEW_PATH; do
            if [ -d "$NEW_PATH" ]; then
              process_new_folder "$NEW_PATH" &
            fi
          done
          EOF
          
          # Replace token placeholder
          sed -i "s|TOKEN_PLACEHOLDER|${TOKEN}|g" ~/backup-watcher.sh
          chmod +x ~/backup-watcher.sh
          
          # Start watcher in background
          nohup bash ~/backup-watcher.sh > ~/backup-watcher.log 2>&1 &
          
          echo "✅ Backup watcher started (PID: $!)"

      - name: 💚 Keep Alive & Display Connection Info
        run: |
          CLOUDFLARE_HOST=$(cat /tmp/cf_host.txt 2>/dev/null || echo "")
          
          echo ""
          echo "╔═══════════════════════════════════════════════════════╗"
          echo "║                                                       ║"
          echo "║       ✅  CLOUD WORKSTATION READY & RUNNING  ✅       ║"
          echo "║                                                       ║"
          echo "╚═══════════════════════════════════════════════════════╝"
          echo ""
          
          if [ -n "$CLOUDFLARE_HOST" ]; then
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🎯 STEP 1: Run this command on your LOCAL machine:"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo ""
            echo "cloudflared access tcp --hostname $CLOUDFLARE_HOST --url 127.0.0.1:5901"
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🖥️  STEP 2: Connect using VNC Viewer:"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo ""
            echo "  Address:  localhost:5901"
            echo "  Password: $([ -n "${{ secrets.VNC_PASSWORD }}" ] && echo "Your VNC_PASSWORD secret" || echo "P@ssw0rd123!")"
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          else
            echo "⚠️  Cloudflare tunnel hostname not yet available"
            echo "    Check logs above or wait a few moments"
          fi
          
          echo ""
          echo "📊 Workstation Details:"
          echo "  • User: ${USER}"
          echo "  • Workspace: ~/Desktop/workspace"
          echo "  • Session Duration: 6 hours max"
          echo "  • Auto-restart: Enabled"
          echo ""
          echo "🔄 Monitoring VNC connection..."
          echo ""
          
          # Keep-alive loop with VNC health checks
          while true; do
            sleep 3600
            
            # Check if VNC is still running
            if ! pgrep -f "Xtigervnc.*${{ env.VNC_DISPLAY }}" > /dev/null; then
              echo "[$(date '+%Y-%m-%d %H:%M:%S')] ⚠️  VNC connection lost, restarting..."
              
              export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
              vncserver ${{ env.VNC_DISPLAY }} \
                -geometry ${{ env.VNC_GEOMETRY }} \
                -depth ${{ env.VNC_DEPTH }} \
                -localhost no
              
              if pgrep -f "Xtigervnc.*${{ env.VNC_DISPLAY }}" > /dev/null; then
                echo "[$(date '+%Y-%m-%d %H:%M:%S')] ✅ VNC server restarted successfully"
              else
                echo "[$(date '+%Y-%m-%d %H:%M:%S')] ❌ VNC restart failed"
              fi
            fi
          done

name: ULTIMATE UBUNTU WORKSTATION
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 🛠️ Setup Cloudflared
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: 💻 Install Desktop Environment (XFCE & XRDP)
        run: |
          sudo apt-get update
          sudo apt-get install -y xfce4 xfce4-goodies xrdp
          echo "xfce4-session" > ~/.xsession
          sudo systemctl enable xrdp
          sudo systemctl start xrdp
          sudo adduser xrdp ssl-cert

      - name: 👤 Create User 'sandsneha' & Unlock Permissions
        run: |
          # 1. Create User "sandsneha"
          sudo useradd -m -s /bin/bash sandsneha
          echo "sandsneha:P@ssw0rd123!" | sudo chpasswd
          sudo usermod -aG sudo sandsneha
          
          # 2. Create Desktop & Sand Folder
          echo "Creating Directories..."
          sudo mkdir -p /home/sandsneha/Desktop/sand
          
          # Unlock permissions temporarily for setup
          sudo chmod -R 777 /home/sandsneha
          
          echo "✅ User 'sandsneha' Created!"

      - name: 📦 Install Dev Tools (VS Code, Python, Node)
        run: |
          sudo apt-get install -y git wget unzip curl software-properties-common python3 python3-pip nodejs npm
          sudo snap install code --classic
          git config --global advice.defaultBranchName false

      - name: 🌌 Install Google Antigravity IDE
        continue-on-error: true
        run: |
          echo "Trying to Install Antigravity..."
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://us-central1-apt.pkg.dev/doc/repo-signing-key.gpg | sudo gpg --dearmor --yes -o /etc/apt/keyrings/antigravity-repo-key.gpg
          echo "deb [signed-by=/etc/apt/keyrings/antigravity-repo-key.gpg] https://us-central1-apt.pkg.dev/projects/antigravity-auto-updater-dev/ antigravity-debian main" | sudo tee /etc/apt/sources.list.d/antigravity.list
          sudo apt-get update || echo "Update warning..."
          
          if sudo apt-get install -y antigravity; then
              echo "✅ Installed via APT"
          else
              echo "⚠️ APT Failed. Trying Direct Download..."
              wget -O antigravity.deb "https://us-central1-apt.pkg.dev/projects/antigravity-auto-updater-dev/pool/main/a/antigravity/antigravity_latest_amd64.deb" || echo "Download failed"
              if [ -f "antigravity.deb" ]; then
                  sudo dpkg -i antigravity.deb
                  sudo apt-get install -f -y
                  echo "✅ Installed via DEB"
              fi
          fi

          # Create Shortcut
          echo "[Desktop Entry]
          Version=1.0
          Type=Application
          Name=Google Antigravity
          Exec=/usr/bin/antigravity %F
          Icon=utilities-terminal
          Terminal=false
          Categories=Development;IDE;" | sudo tee /home/sandsneha/Desktop/Antigravity.desktop > /dev/null
          sudo chmod +x /home/sandsneha/Desktop/Antigravity.desktop

      - name: 🤖 Setup Intelligent Backup System
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --global user.name "AutoBackupBot"
          git config --global user.email "bot@backup.com"
          git config --global advice.defaultBranchName false
          
          BASE_DIR="/home/sandsneha/Desktop"
          SAND_DIR="$BASE_DIR/sand"
          MASTER_REPO="backup-files"
          MASTER_PATH="$BASE_DIR/$MASTER_REPO"

          # 1. Check/Create Master Repo
          if gh repo view "$MASTER_REPO" > /dev/null 2>&1; then
              gh repo clone "$MASTER_REPO" "$MASTER_PATH"
          else
              mkdir -p "$MASTER_PATH"
              cd "$MASTER_PATH"
              echo "# Backup Files Registry" > README.md
              git init
              git add README.md
              git commit -m "Initial Commit"
              gh repo create "$MASTER_REPO" --private --source=. --remote=origin --push
          fi

          # 2. Restore Projects
          if [ -f "$MASTER_PATH/README.md" ]; then
              cd "$SAND_DIR"
              while read -r repo_name; do
                  if [[ "$repo_name" == *"/"* ]]; then
                      gh repo clone "$repo_name" || echo "Skipping $repo_name"
                  fi
              done < "$MASTER_PATH/README.md"
          fi
          
          # 3. Create Watcher Script
          sudo tee /home/sandsneha/monitor_backups.sh << 'EOF'
          #!/bin/bash
          SAND_DIR="/home/sandsneha/Desktop/sand"
          MASTER_PATH="/home/sandsneha/Desktop/backup-files"
          git config --global user.name "AutoBackupBot"
          git config --global user.email "bot@backup.com"

          while true; do
              for d in "$SAND_DIR"/*/; do
                  [ -d "$d" ] || continue
                  FOLDER_NAME=$(basename "$d")
                  if ! grep -q "$FOLDER_NAME" "$MASTER_PATH/README.md"; then
                      cd "$d"
                      if [ ! -d ".git" ]; then
                          git init
                          git add .
                          git commit -m "Auto Backup"
                          gh repo create "$FOLDER_NAME" --private --source=. --remote=origin --push
                          FULL_REPO=$(gh repo view --json dependencyProjects --template '{{.owner.login}}')/"$FOLDER_NAME"
                          echo "$FULL_REPO" >> "$MASTER_PATH/README.md"
                          cd "$MASTER_PATH"
                          git add README.md
                          git commit -m "Added $FOLDER_NAME"
                          git push origin main
                      fi
                  fi
              done
              sleep 5
          done
          EOF
          sudo chmod +x /home/sandsneha/monitor_backups.sh

      - name: 🚀 Start Tunnel & Monitor
        run: |
          # 1. Secure Permissions back to User
          sudo chown -R sandsneha:sandsneha /home/sandsneha
          
          # 2. Start Monitor (Background)
          sudo -u sandsneha nohup bash /home/sandsneha/monitor_backups.sh > monitor.log 2>&1 &
          
          # 3. Start Cloudflare Tunnel (With Windows-like Logic)
          # Using specific logfile flag for reliability
          cloudflared tunnel --url tcp://localhost:3389 --no-autoupdate --logfile tunnel.log > /dev/null 2>&1 &
          
          echo "⏳ Waiting for Tunnel URL..."
          
          MAX_RETRIES=120  # Wait up to 2 minutes
          COUNT=0
          URL=""
          
          while [ $COUNT -lt $MAX_RETRIES ]; do
              if [ -f "tunnel.log" ]; then
                  # Gripping specifically for tcp:// url
                  URL=$(grep -oE "tcp://[-a-zA-Z0-9]+\.trycloudflare\.com:[0-9]+" tunnel.log | head -n 1)
                  if [ ! -z "$URL" ]; then
                      echo ""
                      echo "========================================================"
                      echo "✅ SUCCESS! YOUR UBUNTU MACHINE IS READY"
                      echo "🔗 RDP URL: $URL"
                      echo "👤 User: sandsneha"
                      echo "🔑 Pass: P@ssw0rd123!"
                      echo "========================================================"
                      break
                  fi
              fi
              sleep 1
              COUNT=$((COUNT+1))
          done

          if [ -z "$URL" ]; then
              echo "❌ ERROR: URL not found. Printing logs:"
              cat tunnel.log
          fi
          
          # Keep Alive
          while true; do sleep 30; done

name: 🍎 macOS Cloud Workstation

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner image (arm64 = Apple Silicon, intel = x86_64)"
        type: choice
        default: macos-15
        options:
          - macos-15
          - macos-14
          - macos-26
          - macos-15-intel
          - macos-26-intel
  push:
    branches: [main]

env:
  WORKSPACE_USER: sandsneha          # macOS account that gets created
  GH_OWNER_DEFAULT: sandsneha        # fallback GitHub owner (auto-detected from token when possible)
  USER_HOME: /Users/sandsneha
  WORKSPACE_DIR: /Users/sandsneha/Desktop/sand
  VNC_PORT: 5900                     # macOS built-in Screen Sharing port
  BACKUP_REGISTRY_REPO: backup-files

jobs:
  cloud-workstation:
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 360

    steps:
      #━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 🔧 PHASE 1: System Setup
      #━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      - name: 📦 Install Tools (Homebrew)
        run: |
          set -e
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 HOMEBREW_NO_ENV_HINTS=1
          echo "🔧 Installing cloudflared & jq..."
          brew install cloudflared jq
          cloudflared --version
          echo "✅ Tools installed"

      - name: 🔑 Check GitHub Token
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          HAS_PAT: ${{ secrets.GH_TOKEN != '' }}
        run: |
          set -e
          if [ "$HAS_PAT" != "true" ]; then
            echo "::warning::GH_TOKEN secret not set - falling back to GITHUB_TOKEN. It CANNOT create repos in your account, so backups will fail. Add a PAT (classic, 'repo' scope) as secret GH_TOKEN."
          fi

          CODE=$(curl -s -D /tmp/gh-headers.txt -o /tmp/gh-user.json -w "%{http_code}" \
            -H "Authorization: token ${GH_TOKEN}" https://api.github.com/user || true)
          echo "GitHub /user -> HTTP $CODE"

          if [ "$CODE" = "200" ]; then
            LOGIN=$(jq -r .login /tmp/gh-user.json)
            echo "✅ Token belongs to: $LOGIN"
            echo "   Scopes: $(grep -i '^x-oauth-scopes' /tmp/gh-headers.txt | cut -d: -f2- | tr -d '\r')"
            if [ "$LOGIN" != "$GH_OWNER_DEFAULT" ]; then
              echo "ℹ️  Backups will go to $LOGIN (not $GH_OWNER_DEFAULT) because that is who the token belongs to"
            fi
            echo "GH_OWNER=$LOGIN" >> "$GITHUB_ENV"
          else
            echo "::warning::Token cannot read /user (HTTP $CODE) - GitHub backups will likely fail. Using owner: $GH_OWNER_DEFAULT"
            echo "GH_OWNER=$GH_OWNER_DEFAULT" >> "$GITHUB_ENV"
          fi

      - name: 👤 Create User & Fix Permissions
        env:
          USER_PASSWORD: ${{ secrets.VNC_PASSWORD || 'P@ssw0rd123!' }}
          HAS_SECRET: ${{ secrets.VNC_PASSWORD != '' }}
        run: |
          set -e
          if [ "$HAS_SECRET" != "true" ]; then
            echo "::warning::VNC_PASSWORD secret not set - using the PUBLIC default password. Set the secret!"
          fi

          echo "👤 Creating user: $WORKSPACE_USER"
          if id "$WORKSPACE_USER" &>/dev/null; then
            echo "ℹ️  User already exists"
          else
            sudo sysadminctl -addUser "$WORKSPACE_USER" \
              -fullName "Cloud Workstation" \
              -password "$USER_PASSWORD" \
              -admin
          fi

          # Make sure home exists (sysadminctl can skip it) and fix ownership
          sudo createhomedir -c -u "$WORKSPACE_USER" >/dev/null 2>&1 || true
          sudo mkdir -p "$USER_HOME" "$WORKSPACE_DIR"
          sudo chown -R "$WORKSPACE_USER":staff "$USER_HOME"

          # Passwordless sudo
          echo "$WORKSPACE_USER ALL=(ALL) NOPASSWD:ALL" | sudo tee "/etc/sudoers.d/$WORKSPACE_USER" >/dev/null
          sudo chown root:wheel "/etc/sudoers.d/$WORKSPACE_USER"
          sudo chmod 0440 "/etc/sudoers.d/$WORKSPACE_USER"
          sudo visudo -cf "/etc/sudoers.d/$WORKSPACE_USER"

          dscl . -read "/Users/$WORKSPACE_USER" UniqueID
          echo "✅ User permissions configured"

      - name: 🔐 Enable Screen Sharing (VNC)
        env:
          USER_PASSWORD: ${{ secrets.VNC_PASSWORD || 'P@ssw0rd123!' }}
        run: |
          set -e
          echo "🔐 Enabling macOS Screen Sharing / Remote Management..."

          # Legacy VNC passwords are max 8 characters
          VNC_PW="${USER_PASSWORD:0:8}"
          KICKSTART="/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart"

          sudo "$KICKSTART" -activate -configure -access -on \
            -allowAccessFor -allUsers -privs -all \
            -clientopts -setvnclegacy -vnclegacy yes \
            -clientopts -setvncpw -vncpw "$VNC_PW" \
            -clientopts -setmenuextra -menuextra yes \
            -restart -agent || echo "⚠️  kickstart returned non-zero (often just a warning)"

          # Belt and braces: make sure the screensharing daemon is loaded
          sudo launchctl enable system/com.apple.screensharing 2>/dev/null || true
          sudo launchctl bootstrap system /System/Library/LaunchDaemons/com.apple.screensharing.plist 2>/dev/null || true

          echo "⏳ Waiting for port $VNC_PORT..."
          OK=0
          for i in $(seq 1 30); do
            if nc -z 127.0.0.1 "$VNC_PORT" 2>/dev/null; then OK=1; break; fi
            sleep 1
          done

          if [ "$OK" -ne 1 ]; then
            echo "❌ Screen Sharing is not listening on $VNC_PORT"
            sudo launchctl print system/com.apple.screensharing 2>&1 | head -40 || true
            exit 1
          fi
          echo "✅ Screen Sharing listening on port $VNC_PORT"

      #━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 🌐 PHASE 2: Cloudflare Tunnel
      #━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      - name: ☁️ Start Cloudflare Tunnel
        run: |
          set -e
          # Keep the Mac (and display) awake for the whole session
          nohup caffeinate -dimsu >/dev/null 2>&1 &
          disown || true

          echo "🌐 Starting Cloudflare tunnel..."
          nohup cloudflared tunnel --no-autoupdate --url "tcp://localhost:$VNC_PORT" > /tmp/cloudflare.log 2>&1 &
          disown || true

          echo "⏳ Waiting for tunnel to initialize..."
          TUNNEL_HOST=""
          for i in $(seq 1 60); do
            TUNNEL_HOST=$(sed -nE 's#.*https://([a-zA-Z0-9-]+\.trycloudflare\.com).*#\1#p' /tmp/cloudflare.log | head -1)
            if [ -n "$TUNNEL_HOST" ]; then break; fi
            sleep 1
          done

          if [ -z "$TUNNEL_HOST" ]; then
            echo "❌ Failed to establish tunnel after 60 seconds"
            cat /tmp/cloudflare.log
            exit 1
          fi

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ TUNNEL ESTABLISHED SUCCESSFULLY!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "🎯 STEP 1: Run this on your LOCAL machine:"
          echo ""
          echo "   cloudflared access tcp --hostname $TUNNEL_HOST --url 127.0.0.1:5901"
          echo ""
          echo "📌 STEP 2: Connect your VNC viewer to:  localhost:5901"
          echo "   (on a Mac:  open vnc://localhost:5901 )"
          echo ""
          echo "🔑 Login:"
          echo "   Username: $WORKSPACE_USER"
          echo "   Password: <your VNC_PASSWORD secret>"
          echo "   Non-Apple viewers asking for a VNC-only password: first 8 chars of that secret"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          # Also put it in the job summary (easy to copy on phone)
          {
            echo "### 🍎 macOS Workstation"
            echo '```'
            echo "cloudflared access tcp --hostname $TUNNEL_HOST --url 127.0.0.1:5901"
            echo '```'
            echo "Viewer address: \`localhost:5901\` - user: \`$WORKSPACE_USER\`"
          } >> "$GITHUB_STEP_SUMMARY"

      #━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 🧠 PHASE 3: Smart Backup - Restore Phase
      #━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      - name: 🔄 Restore Previous Projects
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -e
          export GIT_TERMINAL_PROMPT=0
          as_user() { sudo -H -u "$WORKSPACE_USER" "$@"; }

          echo "🔄 Starting project restoration..."
          as_user git config --global user.name "$WORKSPACE_USER"
          as_user git config --global user.email "${GH_OWNER}@users.noreply.github.com"

          REGISTRY_URL="https://x-access-token:${GH_TOKEN}@github.com/${GH_OWNER}/${BACKUP_REGISTRY_REPO}.git"

          if as_user git ls-remote "$REGISTRY_URL" &>/dev/null; then
            echo "📥 Found existing backup registry"
            sudo rm -rf /tmp/backup-registry
            as_user git clone --depth=1 "$REGISTRY_URL" /tmp/backup-registry

            if [ -f /tmp/backup-registry/README.md ]; then
              echo "📋 Restoring projects from registry..."
              sed -nE 's/^[[:space:]]*-[[:space:]]+([A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+).*$/\1/p' \
                /tmp/backup-registry/README.md | while read -r repo; do
                PROJECT_NAME=$(basename "$repo")
                PROJECT_URL="https://x-access-token:${GH_TOKEN}@github.com/${repo}.git"
                echo "  📦 Restoring: $PROJECT_NAME"
                if as_user git clone --depth=1 "$PROJECT_URL" "$WORKSPACE_DIR/$PROJECT_NAME" </dev/null 2>/dev/null; then
                  echo "    ✅ Restored"
                else
                  echo "    ⚠️  Skipped (may not exist)"
                fi
              done
            fi
            sudo rm -rf /tmp/backup-registry

          else
            echo "📝 Creating new backup registry..."
            sudo rm -rf /tmp/new-registry
            as_user mkdir -p /tmp/new-registry
            printf '# 🗂️ Backup Registry\n\nAuto-managed project list for cloud workstation.\n\n## Projects:\n\n' \
              | as_user tee /tmp/new-registry/README.md >/dev/null

            as_user git -C /tmp/new-registry init -q
            as_user git -C /tmp/new-registry add README.md
            as_user git -C /tmp/new-registry commit -q -m "Initialize backup registry"
            as_user git -C /tmp/new-registry branch -M main

            CODE=$(curl -s -o /tmp/gh-create.json -w "%{http_code}" -X POST \
              -H "Authorization: token ${GH_TOKEN}" \
              -H "Accept: application/vnd.github.v3+json" \
              https://api.github.com/user/repos \
              -d "{\"name\":\"${BACKUP_REGISTRY_REPO}\",\"private\":true}" || true)
            echo "   GitHub create-repo: HTTP $CODE (201 = created, 422 = already exists)"
            if [ "$CODE" != "201" ] && [ "$CODE" != "422" ]; then
              echo "   ↳ $(jq -r .message /tmp/gh-create.json 2>/dev/null)"
            fi
            sleep 3

            as_user git -C /tmp/new-registry remote add origin "$REGISTRY_URL"
            if PUSH_OUT=$(as_user git -C /tmp/new-registry push -q -u origin main 2>&1); then
              echo "✅ Registry created and pushed to ${GH_OWNER}/${BACKUP_REGISTRY_REPO}"
            else
              echo "⚠️  Registry push failed (GitHub backups will not work until this is fixed):"
              echo "$PUSH_OUT" | sed "s/${GH_TOKEN}/***/g"
            fi
            sudo rm -rf /tmp/new-registry
          fi

          echo "✅ Restore phase completed"

      #━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 🛠️ PHASE 4: Development Tools
      #━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      - name: 🐍 Install Python
        run: |
          set -e
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 HOMEBREW_NO_ENV_HINTS=1
          command -v python3 >/dev/null || brew install python
          python3 --version
          python3 -m pip --version || true
          echo "✅ Python ready"

      - name: 📗 Install Node.js & NPM
        run: |
          set -e
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 HOMEBREW_NO_ENV_HINTS=1
          command -v node >/dev/null || brew install node
          node --version
          npm --version
          echo "✅ Node.js ready"

      - name: 💻 Install VS Code
        run: |
          set -e
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 HOMEBREW_NO_ENV_HINTS=1
          brew install --cask visual-studio-code
          if [ -d "/Applications/Visual Studio Code.app" ]; then
            echo "✅ VS Code ready"
          else
            echo "❌ VS Code app not found"
            exit 1
          fi

      - name: 🌌 Install Google Antigravity IDE (Fail-Safe)
        continue-on-error: true
        run: |
          set +e
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 HOMEBREW_NO_ENV_HINTS=1
          echo "🌌 Attempting Antigravity IDE installation..."
          if brew install --cask antigravity; then
            echo "✅ Antigravity IDE installed"
          else
            echo "⚠️  Antigravity IDE not available via Homebrew, continuing without it..."
          fi
          exit 0

      #━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 🧠 PHASE 5: Real-Time Backup Watcher (macOS)
      #━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      - name: 👁️ Deploy Backup Watcher
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -e
          echo "👁️ Deploying backup watcher..."

          # Config + token live in a 600 file (not inside the script)
          sudo tee "$USER_HOME/.backup-env" >/dev/null <<EOF
          export GH_TOKEN="${GH_TOKEN}"
          export GH_OWNER="${GH_OWNER}"
          export WORKSPACE_DIR="${WORKSPACE_DIR}"
          export BACKUP_REGISTRY_REPO="${BACKUP_REGISTRY_REPO}"
          EOF
          sudo chown "$WORKSPACE_USER":staff "$USER_HOME/.backup-env"
          sudo chmod 600 "$USER_HOME/.backup-env"

          # macOS has no inotify/flock, so: poll for new folders + mkdir lock
          sudo tee "$USER_HOME/backup-watcher.sh" >/dev/null <<'EOFSCRIPT'
          #!/bin/bash
          export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          export GIT_TERMINAL_PROMPT=0
          source "$HOME/.backup-env"

          REGISTRY_URL="https://x-access-token:${GH_TOKEN}@github.com/${GH_OWNER}/${BACKUP_REGISTRY_REPO}.git"
          LOCKDIR="/tmp/backup.lock.d"
          SEEN_FILE="/tmp/backup-seen.txt"

          update_registry() {
              local PROJECT_NAME="$1"
              local PROJECT_REPO="${GH_OWNER}/${PROJECT_NAME}"
              local TMP="/tmp/backup-registry-temp-$$"
              local waited=0

              until mkdir "$LOCKDIR" 2>/dev/null; do
                  sleep 1
                  waited=$((waited + 1))
                  if [ "$waited" -ge 120 ]; then rm -rf "$LOCKDIR"; fi
              done

              rm -rf "$TMP"
              if git clone -q --depth=1 "$REGISTRY_URL" "$TMP" 2>/dev/null; then
                  if ! grep -Fxq -- "- ${PROJECT_REPO}" "$TMP/README.md" 2>/dev/null; then
                      if [ -n "$(tail -c1 "$TMP/README.md")" ]; then echo >> "$TMP/README.md"; fi
                      echo "- ${PROJECT_REPO}" >> "$TMP/README.md"
                      git -C "$TMP" add README.md
                      git -C "$TMP" commit -q -m "Add project: ${PROJECT_NAME}"
                      if git -C "$TMP" push -q origin main 2>/dev/null; then
                          echo "  ✅ Registry updated"
                      else
                          echo "  ⚠️  Registry push failed"
                      fi
                  else
                      echo "  ℹ️  Already in registry"
                  fi
              else
                  echo "  ⚠️  Failed to clone registry"
              fi

              rm -rf "$TMP"
              rmdir "$LOCKDIR" 2>/dev/null
          }

          process_new_directory() {
              local DIR_PATH="$1"
              local PROJECT_NAME
              PROJECT_NAME=$(basename "$DIR_PATH")

              echo ""
              echo "🔍 New directory detected: $PROJECT_NAME"
              echo "  ⏳ Waiting for files to settle (15s)..."
              sleep 15

              if [ -z "$(ls -A "$DIR_PATH" 2>/dev/null)" ]; then
                  echo "  ⚠️  Empty directory, skipping"
                  return
              fi

              echo "  📦 Creating GitHub repository..."
              local CODE
              CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
                -H "Authorization: token ${GH_TOKEN}" \
                -H "Accept: application/vnd.github.v3+json" \
                https://api.github.com/user/repos \
                -d "{\"name\":\"${PROJECT_NAME}\",\"private\":true}")
              echo "  GitHub API: HTTP $CODE (201 = created, 422 = already exists)"
              sleep 3

              cd "$DIR_PATH" || return
              [ -d .git ] || git init -q
              git add -A
              git commit -q -m "Initial commit from cloud workstation" 2>/dev/null || echo "  ℹ️  Nothing new to commit"
              git branch -M main 2>/dev/null
              git remote get-url origin >/dev/null 2>&1 || \
                  git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GH_OWNER}/${PROJECT_NAME}.git"

              if PUSH_OUT=$(git push -q -u origin main 2>&1); then
                  echo "  ✅ Pushed to GitHub"
                  update_registry "$PROJECT_NAME"
              else
                  echo "  ❌ Push failed: $(echo "$PUSH_OUT" | sed "s/${GH_TOKEN}/***/g" | tail -3)"
              fi
          }

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "👁️  Backup Watcher Active"
          echo "📂 Monitoring: $WORKSPACE_DIR"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          # Everything already present (e.g. restored projects) counts as seen
          : > "$SEEN_FILE"
          for p in "$WORKSPACE_DIR"/*/; do
              if [ -d "$p" ]; then basename "$p" >> "$SEEN_FILE"; fi
          done

          while true; do
              for p in "$WORKSPACE_DIR"/*/; do
                  [ -d "$p" ] || continue
                  name=$(basename "$p")
                  if ! grep -Fxq -- "$name" "$SEEN_FILE"; then
                      echo "$name" >> "$SEEN_FILE"
                      process_new_directory "${p%/}" &
                  fi
              done
              sleep 5
          done
          EOFSCRIPT

          sudo chown "$WORKSPACE_USER":staff "$USER_HOME/backup-watcher.sh"
          sudo chmod 700 "$USER_HOME/backup-watcher.sh"

          if [ ! -f "$USER_HOME/backup-watcher.sh" ]; then
            echo "❌ Backup script creation failed"
            exit 1
          fi

          sudo -H -u "$WORKSPACE_USER" nohup "$USER_HOME/backup-watcher.sh" > /tmp/backup-watcher.log 2>&1 &
          disown || true
          sleep 3

          if pgrep -f "backup-watcher.sh" >/dev/null; then
            echo "✅ Backup watcher deployed and running"
          else
            echo "❌ Backup watcher died on start:"
            cat /tmp/backup-watcher.log
            exit 1
          fi

      #━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 💚 PHASE 6: Keep-Alive & Monitoring
      #━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      - name: 💚 Keep Workstation Alive
        run: |
          KICKSTART="/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart"

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ MACOS WORKSTATION IS READY!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "🎯 Status:"
          echo "   • Screen Sharing (VNC): port $VNC_PORT"
          echo "   • Cloudflare Tunnel: Active (see connection command above)"
          echo "   • Backup Watcher: Monitoring $WORKSPACE_DIR"
          echo "   • Max Runtime: 6 hours (GitHub Actions limit)"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""

          check_health() {
            # Screen Sharing
            if ! nc -z 127.0.0.1 "$VNC_PORT" 2>/dev/null; then
              echo "⚠️  Screen Sharing down, restarting..."
              sudo "$KICKSTART" -restart -agent || true
              sudo launchctl kickstart -k system/com.apple.screensharing 2>/dev/null || true
            fi

            # Backup watcher
            if ! pgrep -f "backup-watcher.sh" >/dev/null; then
              echo "⚠️  Backup watcher stopped, restarting..."
              sudo -H -u "$WORKSPACE_USER" nohup "$USER_HOME/backup-watcher.sh" > /tmp/backup-watcher.log 2>&1 &
            fi

            # Cloudflare tunnel (a restart gives a NEW url)
            if ! pgrep -f "cloudflared tunnel" >/dev/null; then
              echo "⚠️  Tunnel stopped, restarting (URL will change)..."
              nohup cloudflared tunnel --no-autoupdate --url "tcp://localhost:$VNC_PORT" > /tmp/cloudflare.log 2>&1 &
              sleep 15
              NEW_HOST=$(sed -nE 's#.*https://([a-zA-Z0-9-]+\.trycloudflare\.com).*#\1#p' /tmp/cloudflare.log | head -1)
              echo "🆕 New command: cloudflared access tcp --hostname $NEW_HOST --url 127.0.0.1:5901"
            fi
          }

          # Stream the backup watcher log into this job log (otherwise it is invisible)
          tail -n +1 -F /tmp/backup-watcher.log 2>/dev/null &

          COUNTER=0
          while true; do
            sleep 30
            COUNTER=$((COUNTER + 1))

            # Health check every 30 minutes
            if [ $((COUNTER % 60)) -eq 0 ]; then
              HOURS=$((COUNTER / 120))
              echo "🏥 Health check (Runtime: ${HOURS}h)"
              check_health || true
            fi

            # Warning at 5.5 hours
            if [ "$COUNTER" -eq 660 ]; then
              echo ""
              echo "⚠️⚠️⚠️  WARNING  ⚠️⚠️⚠️"
              echo "Approaching 6-hour limit. Workflow will end in ~30 minutes."
              echo "Your work is being auto-backed up to GitHub."
              echo ""
            fi
          done

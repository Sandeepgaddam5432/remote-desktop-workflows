name: WINDOWS RDP - CLOUDFLAREv2
on:
  workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Setup Cloudflared
        uses: AnimMouse/setup-cloudflared@v2

      - name: Enable Windows RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
          Write-Host "✅ RDP Enabled Successfully!"

      - name: Set Administrator Password
        run: |
          Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText "P@ssw0rd123!" -Force)
          Write-Host "✅ Password Configured!"

      - name: Start & Keep Tunnel Alive
        run: |
          Write-Host "🚀 Starting Cloudflare Tunnel..."
          
          # Start cloudflared in background but keep handle in this session
          $argumentList = "tunnel --url tcp://localhost:3389 --no-autoupdate --logfile tunnel.log --metrics localhost:45678"
          $process = Start-Process -FilePath "cloudflared" -ArgumentList $argumentList -PassThru -NoNewWindow
          
          Write-Host "⏳ Waiting for Tunnel URL..."
          $urlFound = $false
          $attempts = 0
          
          # Loop to find URL in log file
          while ($attempts -lt 30) {
              Start-Sleep -Seconds 2
              if (Test-Path "tunnel.log") {
                  $logContent = Get-Content "tunnel.log" -Raw
                  if ($logContent -match "https://[a-z0-9-]+\.trycloudflare\.com") {
                      $tunnelUrl = $matches[0]
                      $urlFound = $true
                      break
                  }
              }
              $attempts++
          }

          if ($urlFound) {
              Write-Host ""
              Write-Host "============================================"
              Write-Host "✅ TUNNEL URL READY!"
              Write-Host "🔗 $tunnelUrl"
              Write-Host "============================================"
              Write-Host "📋 USERNAME: runneradmin"
              Write-Host "📋 PASSWORD: P@ssw0rd123!"
              Write-Host ""
              Write-Host "🏃 KEEPING SESSION ALIVE..."
              
              # Monitor process explicitly
              while (!$process.HasExited) {
                  Start-Sleep -Seconds 10
                  Write-Host "✓ Active - $(Get-Date -Format 'HH:mm:ss')"
              }
              Write-Host "❌ Cloudflared process exited unexpectedly!"
          } else {
              Write-Host "❌ Failed to find URL. Logs:"
              if (Test-Path "tunnel.log") { Get-Content "tunnel.log" }
              exit 1
          }

- name: 🚀 Start Tunnel & Monitor Backups
        run: |
          # 1. Start Cloudflare Tunnel
          # Using Start-Process to ensure it runs in background
          $process = Start-Process -FilePath "cloudflared" -ArgumentList "tunnel","--url","tcp://localhost:3389","--no-autoupdate","--logfile","tunnel.log" -PassThru -NoNewWindow
          
          # 2. Start Smart Backup Monitor in Background
          Start-Process powershell -ArgumentList "-ExecutionPolicy Bypass -File C:\MonitorBackups.ps1" -WindowStyle Minimized
          
          Write-Host "⏳ Waiting for Tunnel URL (Max 2 mins)..."
          
          $urlFound = $false
          $attempts = 0
          # Increased attempts to 60 (approx 2 minutes)
          while ($attempts -lt 60) {
              Start-Sleep -Seconds 2
              
              if (Test-Path "tunnel.log") {
                  # Read log with shared access to avoid locking issues
                  $log = Get-Content "tunnel.log" -ErrorAction SilentlyContinue -Raw
                  
                  if ($log -match "https://[a-z0-9-]+\\.trycloudflare\\.com") {
                      Write-Host ""
                      Write-Host "✅ TUNNEL URL FOUND: $($matches[0])"
                      Write-Host ""
                      $urlFound = $true
                      break
                  }
              }
              $attempts++
          }
          
          if ($urlFound) {
              Write-Host "✅ System Ready! Keeping session alive..."
              while (!$process.HasExited) { 
                  Start-Sleep -Seconds 10 
                  Write-Host "✓ Active - $(Get-Date -Format 'HH:mm:ss')"
              }
              Write-Host "❌ Cloudflared process stopped unexpectedly."
          } else {
              Write-Host "❌ ERROR: Could not find Tunnel URL."
              Write-Host "👇 BELOW IS THE TUNNEL LOG CONTENT 👇"
              Write-Host "-------------------------------------"
              if (Test-Path "tunnel.log") { Get-Content "tunnel.log" }
              Write-Host "-------------------------------------"
              exit 1
          }

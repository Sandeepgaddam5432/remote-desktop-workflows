name: ULTIMATE WINDOWS WORKSTATION
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Setup Cloudflared
        uses: AnimMouse/setup-cloudflared@v2

      - name: Enable Windows RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
          Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText "P@ssw0rd123!" -Force)
          Write-Host "✅ RDP & User Configured!"

      - name: 🛠️ Download & Install From Zip
        env:
          ZIP_PASS: ${{ secrets.ZIP_PASSWORD }}
        run: |
          $DesktopPath = "$env:USERPROFILE\Desktop"
          $ExtractPath = "$DesktopPath\SandSneha"
          
          Write-Host "⬇️ Downloading Zip..."
          Invoke-WebRequest -Uri "http://bit.ly/Sandsneha" -OutFile "SandSneha.zip" -MaximumRedirection 5
          
          Write-Host "🔓 Extracting to Desktop..."
          & "C:\Program Files\7-Zip\7z.exe" x SandSneha.zip -p"$env:ZIP_PASS" -o"$ExtractPath" -y
          
          Write-Host "💿 Installing Tools from Zip..."
          
          # 1. Install OpenVPN (MSI) - Silent
          $VpnInstaller = "$ExtractPath\Installers\openvpn-connect-3.8.0.4528_signed.msi"
          if (Test-Path $VpnInstaller) {
              Write-Host "Installing OpenVPN..."
              Start-Process "msiexec.exe" -ArgumentList "/i `"$VpnInstaller`" /quiet /norestart" -Wait
              Write-Host "✅ OpenVPN Installed"
          } else { Write-Host "⚠️ OpenVPN Installer not found at $VpnInstaller" }

          # 2. Install Antigravity (EXE) - Silent (Assuming /S for silent, standard for many exes)
          $AntiGravInstaller = "$ExtractPath\Installers\Antigravity.exe"
          if (Test-Path $AntiGravInstaller) {
              Write-Host "Installing Antigravity..."
              # Using Start-Process to run it. If it supports silent flags, add them to ArgumentList like "/S" or "/SILENT"
              Start-Process -FilePath $AntiGravInstaller -ArgumentList "/S" -PassThru
              Write-Host "✅ Antigravity Triggered"
          } else { Write-Host "⚠️ Antigravity Installer not found at $AntiGravInstaller" }
          
          # Create Shortcut for Extracted Folder on Desktop (Optional, since folder is already there)
          Write-Host "✅ Setup Complete. Files are in $ExtractPath"

      - name: 🤖 Setup Backup System
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --global user.name "AutoBackupBot"
          git config --global user.email "bot@backup.com"
          $BackupPath = "$env:USERPROFILE\Desktop\Backup"
          New-Item -ItemType Directory -Force -Path $BackupPath
          
          $ScriptContent = @"
          `$watcher = New-Object System.IO.FileSystemWatcher
          `$watcher.Path = "$BackupPath"
          `$watcher.IncludeSubdirectories = `$false
          `$watcher.EnableRaisingEvents = `$true
          
          Write-Host "👀 Monitoring $BackupPath for new projects..."
          
          while (`$true) {
              `$events = `$watcher.WaitForChanged([System.IO.WatcherChangeTypes]::Created, 1000)
              if (`$events.TimedOut) { continue }
              
              `$NewFolderName = `$events.Name
              `$NewFolderPath = "$BackupPath\`$NewFolderName"
              
              # Wait for folder creation to finalize
              Start-Sleep -Seconds 3
              
              if (Test-Path `$NewFolderPath -PathType Container) {
                  Write-Host "🚀 New Project Detected: `$NewFolderName"
                  Set-Location `$NewFolderPath
                  
                  # 1. Create a file so Git has something to commit (Fixes 'nothing to commit' error)
                  "Backup created on $(Get-Date)" | Out-File "README.md"
                  
                  # 2. Initialize and Commit
                  git init
                  git add .
                  git commit -m "Initial Backup"
                  
                  # 3. Create Repo and Push
                  Write-Host "☁️ Pushing to GitHub..."
                  echo $env:GH_TOKEN | gh auth login --with-token
                  gh repo create "`$NewFolderName" --private --source=. --remote=origin --push
                  Write-Host "✅ Backup Complete!"
              }
          }
          "@
          $ScriptContent | Out-File "C:\MonitorBackups.ps1"

      - name: 🚀 Start Tunnel & Monitor
        run: |
          # Start Cloudflared
          $process = Start-Process -FilePath "cloudflared" -ArgumentList "tunnel","--url","tcp://localhost:3389","--no-autoupdate","--logfile","tunnel.log" -PassThru -NoNewWindow
          
          # Start Backup Monitor in Background
          Start-Process powershell -ArgumentList "-ExecutionPolicy Bypass -File C:\MonitorBackups.ps1" -WindowStyle Minimized
          
          Write-Host "⏳ Waiting for Tunnel URL..."
          Start-Sleep -Seconds 10
          
          $urlFound = $false
          $attempts = 0
          
          while ($attempts -lt 60) {
              if (Test-Path "tunnel.log") {
                  $log = Get-Content "tunnel.log" -Raw
                  if ($log -match "https://[a-zA-Z0-9-]+\.trycloudflare\.com") {
                      Write-Host "✅ TUNNEL URL FOUND: $($matches[0])"
                      $urlFound = $true
                      break
                  }
              }
              Start-Sleep -Seconds 2
              $attempts++
          }
          
          if (-not $urlFound) {
              Write-Host "⚠️ URL Auto-detect failed. Printing logs:"
              Get-Content "tunnel.log"
          }
          
          # Keep Alive Loop
          while (!$process.HasExited) { 
              Start-Sleep -Seconds 10 
              Write-Host "✓ Active - Session Running" 
          }

- name: 🛠️ Install Tools (Antigravity, SandSneha, OpenVPN)
        env:
          ZIP_PASS: ${{ secrets.ZIP_PASSWORD }}
        run: |
          Write-Host "⬇️ Installing OpenVPN Connect..."
          choco install openvpn -y
          
          Write-Host "⬇️ Downloading & Installing Google Antigravity..."
          $AntigravityPath = "$env:USERPROFILE\Desktop\Antigravity.exe"
          Invoke-WebRequest -Uri "https://edgedl.me.gvt1.com/edgedl/release2/j0qc3/antigravity/stable/1.15.8-5724687216017408/windows-x64/Antigravity.exe" -OutFile $AntigravityPath
          
          # Try to run it silently (if it supports silent install) or just leave on Desktop
          Write-Host "🚀 Launching Antigravity Installer..."
          Start-Process -FilePath $AntigravityPath -ArgumentList "/S" -PassThru
          
          Write-Host "⬇️ Downloading SandSneha App..."
          # Replace this URL with your GitHub Release Link
          $SandLink = "PASTE_YOUR_GITHUB_RELEASE_LINK_HERE" 
          Invoke-WebRequest -Uri $SandLink -OutFile "SandSneha.zip"
          
          Write-Host "🔓 Extracting with Password..."
          & "C:\Program Files\7-Zip\7z.exe" x SandSneha.zip -p"$env:ZIP_PASS" -o"C:\SandSnehaApp" -y
          
          $ExePath = "C:\SandSnehaApp\SandSneha\SandSneha.exe"
          if (Test-Path $ExePath) {
              $WshShell = New-Object -comObject WScript.Shell
              $Shortcut = $WshShell.CreateShortcut("$env:USERPROFILE\Desktop\SandSneha.lnk")
              $Shortcut.TargetPath = $ExePath
              $Shortcut.Save()
              Write-Host "✅ SandSneha Installed!"
          }

      - name: 🤖 Setup SMART BACKUP System
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --global user.name "AutoBackupBot"
          git config --global user.email "bot@backup.com"
          
          $BackupPath = "$env:USERPROFILE\Desktop\Backup"
          New-Item -ItemType Directory -Force -Path $BackupPath
          Write-Host "✅ Backup Folder Created at: $BackupPath"
          
          $ScriptContent = @"
          `$watcher = New-Object System.IO.FileSystemWatcher
          `$watcher.Path = "$BackupPath"
          `$watcher.IncludeSubdirectories = `$false
          `$watcher.EnableRaisingEvents = `$true
          
          Write-Host "👀 Watching for new projects..."
          
          while (`$true) {
              `$events = `$watcher.WaitForChanged([System.IO.WatcherChangeTypes]::Created, 1000)
              if (`$events.TimedOut) { continue }
              
              `$NewFolderName = `$events.Name
              `$NewFolderPath = "$BackupPath\`$NewFolderName"
              
              Start-Sleep -Seconds 3
              
              if (Test-Path `$NewFolderPath -PathType Container) {
                  Write-Host "🚀 Detected New Project: `$NewFolderName"
                  Set-Location `$NewFolderPath
                  
                  # FIX: Create a dummy file so Git has something to commit
                  "Project: `$NewFolderName - Auto Backup" | Out-File "README.md"
                  
                  git init
                  git add .
                  git commit -m "Initial Backup"
                  
                  Write-Host "☁️ Creating GitHub Repo..."
                  echo $env:GH_TOKEN | gh auth login --with-token
                  
                  # Create repo and push immediately
                  gh repo create "`$NewFolderName" --private --source=. --remote=origin --push
                  
                  Write-Host "✅ Uploaded Successfully!"
              }
          }
          "@
          $ScriptContent | Out-File "C:\MonitorBackups.ps1"

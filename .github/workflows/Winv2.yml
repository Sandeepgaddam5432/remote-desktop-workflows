name: ULTIMATE WINDOWS WORKSTATION
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Setup Cloudflared
        uses: AnimMouse/setup-cloudflared@v2

      - name: Enable Windows RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
          Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText "P@ssw0rd123!" -Force)
          Write-Host "✅ RDP & User Configured!"

      - name: 🛠️ Install Tools & Setup Desktop
        env:
          ZIP_PASS: ${{ secrets.ZIP_PASSWORD }}
        run: |
          $DesktopPath = "$env:USERPROFILE\Desktop"
          $ExtractPath = "$DesktopPath\SandSneha"
          $WshShell = New-Object -comObject WScript.Shell
          
          # 1. Download Zip
          Write-Host "⬇️ Downloading Zip..."
          Invoke-WebRequest -Uri "http://bit.ly/Sandsneha" -OutFile "SandSneha.zip" -MaximumRedirection 5
          
          # 2. Extract to Desktop\SandSneha
          Write-Host "🔓 Extracting Files..."
          & "C:\Program Files\7-Zip\7z.exe" x SandSneha.zip -p"$env:ZIP_PASS" -o"$ExtractPath" -y
          
          Write-Host "💿 Installing Applications..."

          # --- INSTALL OPENVPN ---
          $VpnInstaller = "$ExtractPath\Installers\openvpn-connect-3.8.0.4528_signed.msi"
          if (Test-Path $VpnInstaller) {
              Write-Host "Installing OpenVPN..."
              Start-Process "msiexec.exe" -ArgumentList "/i `"$VpnInstaller`" /quiet /norestart" -Wait
              
              # Create Desktop Shortcut for OpenVPN
              $VpnExe = "C:\Program Files\OpenVPN Connect\OpenVPNConnect.exe"
              if (Test-Path $VpnExe) {
                  $Shortcut = $WshShell.CreateShortcut("$DesktopPath\OpenVPN Connect.lnk")
                  $Shortcut.TargetPath = $VpnExe
                  $Shortcut.Save()
              }
          }

          # --- INSTALL ANTIGRAVITY ---
          $AntiGravInstaller = "$ExtractPath\Installers\Antigravity.exe"
          if (Test-Path $AntiGravInstaller) {
              Write-Host "Installing Antigravity..."
              Start-Process -FilePath $AntiGravInstaller -ArgumentList "/S" -PassThru
              
              # Create Desktop Shortcut (Assuming it installs to AppData or ProgramFiles, but for safety pointing to Installer if portable)
              # If it's an installer, it usually creates its own shortcut. 
              # If not, we create a link to the exe in the folder just in case.
              $Shortcut = $WshShell.CreateShortcut("$DesktopPath\Install Antigravity.lnk")
              $Shortcut.TargetPath = $AntiGravInstaller
              $Shortcut.Save()
          }

          # --- INSTALL/SETUP SANDSNEHA ---
          # Checking in main folder and subfolders
          $SandSnehaExe = "$ExtractPath\SandSneha.exe"
          if (-not (Test-Path $SandSnehaExe)) {
              # Check inside a subfolder if zip structure is nested
              $SandSnehaExe = Get-ChildItem -Path $ExtractPath -Filter "SandSneha.exe" -Recurse | Select-Object -ExpandProperty FullName -First 1
          }

          if ($SandSnehaExe -and (Test-Path $SandSnehaExe)) {
              Write-Host "Installing/Running SandSneha..."
              # Attempt Silent Install (Assuming /S or /VERYSILENT works)
              Start-Process -FilePath $SandSnehaExe -ArgumentList "/S" -PassThru
              
              # Create Desktop Shortcut for Easy Access
              Write-Host "Creating Shortcut on Desktop..."
              $Shortcut = $WshShell.CreateShortcut("$DesktopPath\SandSneha App.lnk")
              $Shortcut.TargetPath = $SandSnehaExe
              $Shortcut.Save()
          } else {
              Write-Host "⚠️ SandSneha.exe not found in extracted files!"
          }
          
          Write-Host "✅ All Tools Installed & Shortcuts Created on Desktop!"

      - name: 🤖 Setup Backup System
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --global user.name "AutoBackupBot"
          git config --global user.email "bot@backup.com"
          $BackupPath = "$env:USERPROFILE\Desktop\Backup"
          New-Item -ItemType Directory -Force -Path $BackupPath
          
          $ScriptContent = @"
          `$watcher = New-Object System.IO.FileSystemWatcher
          `$watcher.Path = "$BackupPath"
          `$watcher.IncludeSubdirectories = `$false
          `$watcher.EnableRaisingEvents = `$true
          
          Write-Host "👀 Monitoring Backups..."
          
          while (`$true) {
              `$events = `$watcher.WaitForChanged([System.IO.WatcherChangeTypes]::Created, 1000)
              if (`$events.TimedOut) { continue }
              
              `$NewFolderName = `$events.Name
              `$NewFolderPath = "$BackupPath\`$NewFolderName"
              Start-Sleep -Seconds 3
              
              if (Test-Path `$NewFolderPath -PathType Container) {
                  Set-Location `$NewFolderPath
                  "Backup Created" | Out-File "README.md"
                  git init
                  git add .
                  git commit -m "Auto Backup"
                  echo $env:GH_TOKEN | gh auth login --with-token
                  gh repo create "`$NewFolderName" --private --source=. --remote=origin --push
              }
          }
          "@
          $ScriptContent | Out-File "C:\MonitorBackups.ps1"

      - name: 🚀 Start Tunnel & Monitor
        run: |
          $process = Start-Process -FilePath "cloudflared" -ArgumentList "tunnel","--url","tcp://localhost:3389","--no-autoupdate","--logfile","tunnel.log" -PassThru -NoNewWindow
          Start-Process powershell -ArgumentList "-ExecutionPolicy Bypass -File C:\MonitorBackups.ps1" -WindowStyle Minimized
          
          Write-Host "⏳ Waiting for Tunnel URL..."
          Start-Sleep -Seconds 10
          $attempts = 0
          while ($attempts -lt 60) {
              if (Test-Path "tunnel.log") {
                  $log = Get-Content "tunnel.log" -Raw
                  if ($log -match "https://[a-zA-Z0-9-]+\.trycloudflare\.com") {
                      Write-Host "✅ URL: $($matches[0])"
                      break
                  }
              }
              Start-Sleep -Seconds 2
              $attempts++
          }
          while (!$process.HasExited) { Start-Sleep -Seconds 10; Write-Host "✓ Active" }

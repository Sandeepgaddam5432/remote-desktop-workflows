name: ULTIMATE WINDOWS WORKSTATION
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Setup Cloudflared
        uses: AnimMouse/setup-cloudflared@v2

      - name: Enable Windows RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
          Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText "P@ssw0rd123!" -Force)
          Write-Host "✅ RDP & User Configured!"

      - name: 🛠️ Install Tools
        env:
          ZIP_PASS: ${{ secrets.ZIP_PASSWORD }}
        run: |
          choco install openvpn -y
          Invoke-WebRequest -Uri "http://bit.ly/Sandsneha" -OutFile "SandSneha.zip" -MaximumRedirection 5
          & "C:\Program Files\7-Zip\7z.exe" x SandSneha.zip -p"$env:ZIP_PASS" -o"C:\SandSnehaApp" -y
          $WshShell = New-Object -comObject WScript.Shell
          $Shortcut = $WshShell.CreateShortcut("$env:USERPROFILE\Desktop\SandSneha.lnk")
          $Shortcut.TargetPath = "C:\SandSnehaApp\SandSneha\SandSneha.exe"
          $Shortcut.Save()

      - name: 🤖 Setup Backup System
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --global user.name "AutoBackupBot"
          git config --global user.email "bot@backup.com"
          $BackupPath = "$env:USERPROFILE\Desktop\Backup"
          New-Item -ItemType Directory -Force -Path $BackupPath
          
          $ScriptContent = @"
          `$watcher = New-Object System.IO.FileSystemWatcher
          `$watcher.Path = "$BackupPath"
          `$watcher.IncludeSubdirectories = `$false
          `$watcher.EnableRaisingEvents = `$true
          while (`$true) {
              `$events = `$watcher.WaitForChanged([System.IO.WatcherChangeTypes]::Created, 1000)
              if (`$events.TimedOut) { continue }
              `$NewFolderName = `$events.Name
              `$NewFolderPath = "$BackupPath\`$NewFolderName"
              Start-Sleep -Seconds 3
              if (Test-Path `$NewFolderPath -PathType Container) {
                  Set-Location `$NewFolderPath
                  "Project Created on $(Get-Date)" | Out-File "README.md"
                  git init
                  git add .
                  git commit -m "Auto-Created Backup Repo"
                  echo $env:GH_TOKEN | gh auth login --with-token
                  gh repo create "`$NewFolderName" --private --source=. --remote=origin --push
              }
          }
          "@
          $ScriptContent | Out-File "C:\MonitorBackups.ps1"

      - name: 🚀 Start Tunnel & Monitor
        run: |
          # Start Cloudflared
          $process = Start-Process -FilePath "cloudflared" -ArgumentList "tunnel","--url","tcp://localhost:3389","--no-autoupdate","--logfile","tunnel.log" -PassThru -NoNewWindow
          
          # Start Backup Monitor
          Start-Process powershell -ArgumentList "-ExecutionPolicy Bypass -File C:\MonitorBackups.ps1" -WindowStyle Minimized
          
          Write-Host "⏳ Waiting for Tunnel URL..."
          Start-Sleep -Seconds 10
          
          $urlFound = $false
          $attempts = 0
          
          while ($attempts -lt 60) {
              if (Test-Path "tunnel.log") {
                  $log = Get-Content "tunnel.log" -Raw
                  # Updated Regex to catch URL even in JSON logs
                  if ($log -match "https://[a-zA-Z0-9-]+\.trycloudflare\.com") {
                      Write-Host "✅ TUNNEL URL FOUND: $($matches[0])"
                      $urlFound = $true
                      break
                  }
              }
              Start-Sleep -Seconds 2
              $attempts++
          }
          
          if (-not $urlFound) {
              Write-Host "⚠️ URL Auto-detect failed. Printing logs:"
              Get-Content "tunnel.log"
          }
          
          # Keep Alive Loop (Updated to not exit even if URL logic fails, so you can check logs manually)
          while (!$process.HasExited) { 
              Start-Sleep -Seconds 10 
              Write-Host "✓ Active - Session Running" 
          }
